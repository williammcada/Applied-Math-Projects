const MC=(()=>{
const VERSION='0.1.0', KEYS=['water','oxygen','habitat','solar','battery'], BASE={water:3,oxygen:3,habitat:3,solar:4,battery:1,crate:'standard'}, EQUIP={water:[30,8,150,1500],oxygen:[8,12,200,2000],habitat:[24,10,400,3000],solar:[36,0,100,1000],battery:[36,0,80,800]};

function number(v){if(typeof v!=='string'&&typeof v!=='number')return NaN;let t=String(v).trim().replace(/−/g,'-');if(!t||t.length>60)return NaN;let a=t.split('/');if(a.length>2)return NaN;const parse=s=>{s=s.trim();if(!/^[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?$/.test(s))return NaN;return Number(s.replace(/,/g,''))};let n=parse(a[0]);if(a.length===2){let d=parse(a[1]);if(!d)return NaN;n/=d}return Number.isFinite(n)?n:NaN}
function validPlan(p){return p&&KEYS.every(k=>Number.isInteger(p[k])&&p[k]>=0&&p[k]<=12)&&['standard','lean'].includes(p.crate)}
function model(p){if(!validPlan(p))throw Error('Choose whole module counts from 0 to 12.');let food=p.crate==='lean'?158.4:172.8,mass=144+38.4+food+100,cost=p.crate==='lean'?800:1000,load=24;for(let k of KEYS){mass+=p[k]*EQUIP[k][2];cost+=p[k]*EQUIP[k][3];load+=p[k]*EQUIP[k][1]}const rates={water:30*p.water-72,oxygen:8*p.oxygen-19.2,food:-14.4},initial={water:144,oxygen:38.4,food},caps={water:400,oxygen:100,food:200},days=[{day:0,...initial,battery:36*p.battery,unserved:0,resourceShortage:0}];for(let d=1;d<=10;d++){let prev=days[d-1],r={day:d,unserved:0,resourceShortage:0};for(let k of ['water','oxygen','food']){let raw=prev[k]+rates[k];r[k]=round(Math.max(0,Math.min(caps[k],raw)));r.resourceShortage+=Math.max(0,-raw)}let balance=(d>=4&&d<=6?27:36)*p.solar-load,raw=prev.battery+balance;r.battery=round(Math.max(0,Math.min(36*p.battery,raw)));r.unserved=round(Math.max(0,-raw));days.push(r)}let reasons=[];if(p.habitat*8<24||p.habitat*24<72)reasons.push('Habitat capacity or floor area is too small.');if(p.water*30<72)reasons.push('Daily water production is below 72 L/day.');if(p.oxygen*8<19.2)reasons.push('Daily oxygen production is below 19.2 kg/day.');if(days.some(x=>x.resourceShortage>0))reasons.push('A resource runs out during the mission.');if(days.some(x=>x.unserved>0))reasons.push('Stored energy and solar output cannot cover every modeled day.');if(cost>26000)reasons.push('Cost exceeds the 26,000 cr budget.');if(mass>3400)reasons.push('Cargo exceeds 3,400 kg.');let last=days[10],resilient=last.water>=144&&last.oxygen>=38.4&&last.food>=28.8;return {mass:round(mass),cost,load,rates,initial,caps,days,reasons,ending:reasons.length?'Deployment delayed':resilient?'Resilient outpost':'Mission ready',budget:26000-cost,cargo:round(3400-mass),area:24*p.habitat,occupancy:8*p.habitat,perPerson:p.habitat,storm:27*p.solar,normal:36*p.solar,balance:27*p.solar-load}}
const F={};function def(id,stage,label,unit,expected,deps=[],help='Multiply the rate by the number of people or days. Example: 5 people × 2 L/person/day = 10 L/day.',options=null){F[id]={id,stage,label,unit,expected,deps,help,options};}
def('waterDaily',2,'Daily water demand','L/day',()=>72);def('oxygenDaily',2,'Daily oxygen demand','kg/day',()=>19.2);def('foodDaily',2,'Daily food demand','kg/day',()=>14.4);def('waterTotal',2,'Ten-day water demand','L',()=>720);def('oxygenTotal',2,'Ten-day oxygen demand','kg',()=>192);def('foodTotal',2,'Ten-day food demand','kg',()=>144);
for(let [id,u,value]of [['liters','L','stock'],['waterRate','L/day','rate'],['kilograms','kg','stock'],['massRate','kg/day','rate'],['energy','kWh','stock'],['energyRate','kWh/day','rate']])def(id,2,'Classify '+u,'',()=>value,[],'Stock is an amount at a moment; rate is an amount per time. Example: 5 L is stock; 5 L/day is a rate.',['stock','rate']);
def('grams',2,'Convert 0.8 kg to grams','g',()=>800,[],'Multiply kilograms by 1,000. Example: 1.2 kg = 1,200 g.');def('milliliters',2,'Convert 3 L to milliliters','mL',()=>3000,[],'Multiply liters by 1,000. Example: 2 L = 2,000 mL.');
const ceilHelp='Divide demand by one module’s capacity, then round upward to a whole module. Example: 13 ÷ 6 needs 3 modules, whose capacity is 18.';
for(let [id,label,value,unit]of [['minWater','Minimum water modules',3,'modules'],['minOxygen','Minimum oxygen modules',3,'modules'],['minHabitat','Minimum habitats',3,'habitats'],['waterCapacity','Water capacity at the minimum count',90,'L/day'],['oxygenCapacity','Oxygen capacity at the minimum count',24,'kg/day'],['housingCapacity','Occupancy at the minimum count',24,'people']])def(id,3,label,unit,()=>value,[],ceilHelp);
def('area',3,'Selected habitat floor area','m²',s=>model(s.plan).area,['habitat'],'Multiply floor area by habitat count. Example: 2 habitats × 20 m² = 40 m².');def('occupancy',3,'Selected habitat occupancy','people',s=>model(s.plan).occupancy,['habitat'],'Multiply occupancy per habitat by count. Example: 2 habitats × 6 people = 12 people.');def('perPerson',3,'Selected floor area per settler','m²/person',s=>model(s.plan).perPerson,['habitat'],'Divide total area by 24 settlers. Example: 60 m² ÷ 20 people = 3 m²/person.');
for(let[id,label,unit]of [['mass','Total cargo','kg'],['cost','Total cost','cr'],['cargo','Cargo capacity remaining (may be negative)','kg'],['budget','Budget remaining (may be negative)','cr']])def(id,4,label,unit,s=>model(s.plan)[id],[...KEYS,'crate'],'Multiply each equipment count by its mass/cost, add crate contents, then subtract from the limit. Example: a 100 cr limit − 120 cr cost = −20 cr.');
const forecastDeps=['resource','water','oxygen','crate'];
def('initial',5,'Stock equation: initial amount','selected resource units',s=>model(s.plan).initial[s.resource],forecastDeps,'Write stock = initial + net daily change × t. Example: S(t)=50+3t. Enter 50 as initial and 3 as net.');def('net',5,'Stock equation: signed net daily change','units/day',s=>round(model(s.plan).rates[s.resource]),forecastDeps,'Subtract daily use from production. Example: 12 L/day − 15 L/day = −3 L/day. Food has no daily production.');
def('xAxis',5,'Horizontal axis','',()=> 'Earth days',[],'The horizontal axis measures time in 24-hour Earth days.',['Earth days','Resource amount']);def('yAxis',5,'Vertical axis unit','',s=>s.resource==='water'?'L':'kg',forecastDeps,'Use the selected resource’s stock unit; do not use its per-day rate.',['L','kg','kWh','L/day','kg/day']);
for(let d of [0,5,10]){def('table'+d,5,'Table: stock after day '+d,'selected resource units',s=>model(s.plan).days[d][s.resource],forecastDeps,'Start with the initial amount; add net daily change each day. Apply the stated tank cap and record any unmet demand separately. Example: min(100,80+5×6)=100.');def('point'+d,5,'Plot point: y-value at x = '+d,'selected resource units',s=>model(s.plan).days[d][s.resource],forecastDeps,'Enter the ordered pair’s y coordinate from your table. Example: at day 2 with 40 L, plot (2,40).')}
def('percent',6,'Percentage of solar yield remaining','%',()=>75,[],'Subtract the loss from 100%. Example: a 10% reduction leaves 90%.');def('perArray',6,'Storm yield per array','kWh/day',()=>27,[],'Multiply normal yield by the remaining percentage as a decimal. Example: 40 × 0.8 = 32.');
for(let[id,label]of [['load','Total daily electrical load'],['normal','Normal solar output'],['storm','Storm solar output'],['balance','Signed storm surplus / deficit']])def(id,6,label,'kWh/day',s=>model(s.plan)[id],['water','oxygen','habitat','solar'],'Load = fixed load + equipment use. Balance = generation − load. Batteries store kWh; they do not generate kWh/day. Example: 80 − 90 = −10 kWh/day.');
for(let d of [3,4,5,6,7])def('battery'+d,7,'Stored energy at end of day '+d,'kWh',s=>model(s.plan).days[d].battery,KEYS,'Start full. Add daily generation minus load, bounded by zero and usable capacity. Record uncovered shortages separately. Example: 20 stored − 8 deficit = 12 kWh.');
def('unserved',7,'Total unserved energy during days 4–6','kWh',s=>round(model(s.plan).days.slice(4,7).reduce((a,x)=>a+x.unserved,0)),KEYS,'When the battery is empty, record any remaining deficit as unserved. Example: 3 stored − 8 needed leaves 5 kWh unserved.');
for(let[id,label,unit,val]of [['compareCost','Reference B minus A: cost','cr',200],['compareMass','Reference B minus A: cargo','kg',20],['compareBattery','Reference A: stored energy after day 6','kWh',18],['compareSurplus','Reference B: storm daily surplus','kWh/day',21]])def(id,7,label,unit,()=>val,[],'Compare the two standard-crate reference configurations, each with three water, oxygen and habitat modules. A: 4 arrays + 1 battery. B: 5 arrays + 0 batteries. Subtract A from B for differences. Example: 500 − 450 = 50.');
for(let[who,n]of [['A',30],['B',28]]){def('transfer'+who+'Water',8,'Partner '+who+': daily water for '+n+' settlers','L/day',()=>n*3,[],'Apply the per-person rate to the new population. Example: 12 people × 3 L/day = 36 L/day.');def('transfer'+who+'Modules',8,'Partner '+who+': minimum 30 L/day water modules','modules',()=>Math.ceil(n*3/30),[],ceilHelp)}
function fingerprint(s,f){let deps=f.deps;if(f.stage===5&&deps.includes('resource'))deps=['resource',...(s.resource==='food'?['crate']:[s.resource])];return JSON.stringify(deps.map(k=>k==='resource'?s.resource:s.plan[k]))}

function validate(s){if(!s||s.schema!=='mcada-project-progress'||s.schemaVersion!=='1.0.0'||s.contentVersion!=='1.0.0'||s.projectId!=='mars-colony')throw Error('Wrong project or unsupported schema/content version.');if(!validPlan(s.plan)||!['water','oxygen','food'].includes(s.resource)||typeof s.teamAlias!=='string'||s.teamAlias.length>60||!Number.isInteger(s.currentStage)||s.currentStage<1||s.currentStage>8||!Number.isInteger(s.unlocked)||s.unlocked<1||s.unlocked>8||s.currentStage>s.unlocked||!Number.isInteger(s.revision)||s.revision<0||typeof s.sessionId!=='string'||!/^mc-[a-zA-Z0-9-]+$/.test(s.sessionId))throw Error('Invalid mission configuration.');if(!s.inputs||!s.notes||!s.checkpoints||!Array.isArray(s.attempts)||s.attempts.length>10000||!Array.isArray(s.help)||s.help.length>10000)throw Error('Invalid evidence records.');for(let[k,v]of Object.entries(s.inputs))if(!F[k]||typeof v!=='string'||v.length>120)throw Error('Invalid response field.');for(let[k,v]of Object.entries(s.notes))if(!['choice','reason','limitation'].includes(k)||typeof v!=='string'||v.length>1500)throw Error('Invalid reflection.');for(let[k,c]of Object.entries(s.checkpoints))if(!F[k]||!c||typeof c.ok!=='boolean'||typeof c.response!=='string'||typeof c.fp!=='string'||typeof c.first!=='string')throw Error('Invalid checkpoint.');for(let a of s.attempts)if(!a||!F[a.field]||typeof a.response!=='string'||typeof a.ok!=='boolean'||!validPlan(a.plan)||typeof a.at!=='string')throw Error('Invalid attempt.');for(let h of s.help)if(!h||!F[h.field]||typeof h.at!=='string')throw Error('Invalid help record.');const keys=Object.keys(newSession());if(Object.keys(s).some(k=>!keys.includes(k)))throw Error('Unsupported save field.');return JSON.parse(JSON.stringify(s))}

const PREFIX='mcada:mars-colony:session:',names=['Arrival request','Demand console','Module bay','Supply manifest','Resource forecast','Storm briefing','Resilience test','Mission control'],esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let s=null,errors=[],saveMessage='Work stays on this device. Export a backup.',memory={},pendingImport=[],opener=null,conflict=false;
const $=q=>document.querySelector(q),btn=(a,t,cls='',extra='')=>`<button data-action="${a}" class="${cls}" ${extra}>${t}</button>`;
function sessions(){let all={...memory};try{for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith(PREFIX)){try{let x=MC.validate(JSON.parse(localStorage.getItem(k)));all[x.sessionId]=x}catch{saveMessage='An unreadable saved record was retained. Export other work before clearing Mars records.'}}}}catch{}return Object.values(all)}
function save(){if(!s)return;try{let stored=localStorage.getItem(PREFIX+s.sessionId);if(stored&&JSON.parse(stored).revision>s.revision){conflict=true;saveMessage='Another tab saved a newer version. Reload that version or save your work as a copy.';memory[s.sessionId]=structuredClone(s);return}if(conflict)return;s.revision++;localStorage.setItem(PREFIX+s.sessionId,JSON.stringify(s));memory[s.sessionId]=structuredClone(s);saveMessage='Saved on this device · '+new Date().toLocaleTimeString()}catch{memory[s.sessionId]=structuredClone(s);saveMessage='Device storage unavailable. Work is in memory—export progress before closing.'}const e=$('#save-status');if(e)e.textContent=saveMessage}
function modal(html){opener=document.activeElement;$('#dialog').innerHTML=html+`<div class="actions">${btn('close','Close')}</div>`;$('#dialog').showModal()}
function close(){$('#dialog').close();opener?.focus()}
function story(text){return `<section class="story"><h3>Story</h3><p>${text}</p></section>`}function task(text){return `<section class="task"><h3>Your task</h3><p>${text}</p></section>`}
function field(f){let ok=MC.current(s,f.id),c=s.checkpoints[f.id],e=errors.find(x=>x.id===f.id),value=s.inputs[f.id]??'';return `<div class="field ${e?'invalid':''}"><label for="f-${f.id}">${esc(f.label)}</label><div class="entry">${f.options?`<select id="f-${f.id}" data-field="${f.id}"><option value="">Choose…</option>${f.options.map(x=>`<option ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input id="f-${f.id}" data-field="${f.id}" inputmode="decimal" value="${esc(value)}" autocomplete="off" maxlength="120">`}${btn('help','?','help',`data-id="${f.id}" aria-label="Help: ${esc(f.label)}"`)}</div><div class="unit">${esc(f.unit)} · Exact value; equivalent fractions accepted.</div><div class="status ${ok?'checked':c?.ok?'stale':''}">${ok?'✓ Checked':c?.ok?'Needs recheck — answer or source inputs changed.':'Not yet checked'}</div>${e?`<p class="error">${esc(e.message)}</p>`:''}</div>`}
const fields=(stage,filter=null)=>`<div class="grid">${MC.fields(stage).filter(f=>!filter||filter(f)).map(field).join('')}</div>`;
function table(rows,heads,caption=''){return `<div class="table-wrap"><table>${caption?'<caption>'+esc(caption)+'</caption>':''}<thead><tr>${heads.map(h=>'<th>'+esc(h)+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}
function equipment(edit=true){return `<div class="card"><h3>Equipment catalog</h3><p>Invented classroom values. Counts may be 0–12 whole modules.</p>${MC.KEYS.map(k=>`<div class="equipment">${Art.icon(k)}<div class="detail"><strong>${k[0].toUpperCase()+k.slice(1)}</strong><div>${{water:'30 L/day · uses 8 kWh/day',oxygen:'8 kg/day · uses 12 kWh/day',habitat:'8 people · 24 m² · uses 10 kWh/day',solar:'36 kWh/day normally · 27 in storm',battery:'36 kWh usable storage · starts full'}[k]}</div><small>${MC.EQUIP[k][2]} kg · ${MC.EQUIP[k][3]} cr each</small></div>${edit?`<label><span class="unit">Count</span><input aria-label="${k} count" data-plan="${k}" type="number" min="0" max="12" step="1" value="${s.plan[k]}"></label>`:`<strong>× ${s.plan[k]}</strong>`}</div>`).join('')}</div>`}
function timeline(){let m=MC.model(s.plan);return table(m.days.map(x=>[x.day,x.water,x.oxygen,x.food,x.battery,x.unserved]),['Earth day','Water (L)','Oxygen (kg)','Food (kg)','Battery (kWh)','Unserved energy (kWh)'],'Daily end-of-day stores; excess production spills at the cap')}
function diagram(){let m=MC.model(s.plan);return `<div class="card"><h3>System diagram · ${MC.current(s,'load')?'checked':'reference'}</h3>${table([['Water',s.plan.water*30+' L/day','72 L/day','144 L initially; 400 L cap'],['Oxygen',s.plan.oxygen*8+' kg/day','19.2 kg/day','38.4 kg initially; 100 kg cap'],['Food','0 kg/day','14.4 kg/day',m.initial.food+' kg initially; 200 kg cap'],['Energy',m.normal+' normally / '+m.storm+' storm kWh/day',m.load+' kWh/day',36*s.plan.battery+' kWh usable battery']],['System','Production →','→ Daily use','Storage'])}<p>Production → daily use → storage change. Storage is an amount, not an extra daily production rate. This is daily accounting, not a model of continuous electrical supply.</p></div>`}
function reflection(){return `<div class="card"><h3>Defend your choice · teacher review</h3><p>Reference A: standard crate, 3 water + 3 oxygen + 3 habitats, 4 arrays + 1 battery. Reference B: same, but 5 arrays + 0 batteries.</p><label>Which reference design would you choose?<select data-note="choice"><option value="">Choose…</option>${['A','B'].map(x=>`<option ${s.notes.choice===x?'selected':''}>${x}</option>`).join('')}</select></label><p><label>One benefit and one cost, with numerical evidence<textarea data-note="reason" maxlength="1500">${esc(s.notes.reason)}</textarea></label></p><label>One limitation of this simplified model<textarea data-note="limitation" maxlength="1500">${esc(s.notes.limitation)}</textarea></label><p class="subtle">Submitted writing or a teacher-transcribed oral response is reviewed by your teacher. The app checks completion, not the quality of your argument.</p></div>`}
function allChecked(){return Object.keys(MC.F).every(id=>MC.current(s,id))&&s.brief&&s.teamAlias.trim()&&['A','B'].includes(s.notes.choice)&&s.notes.reason?.trim()&&s.notes.limitation?.trim()}
function end(){let m=MC.model(s.plan);if(!allChecked())return `<div class="notice">Mission report pending. Complete or recheck all fields and both partners’ transfer work. Earlier entries are retained.</div>`;return `<div class="card"><p class="eyebrow">Mission decision</p><h2>${m.ending}</h2>${Art.scene(s.plan,m.ending)}${story(m.reasons.length?'The arrival team will wait in orbit while mission control revises the outpost plan.':m.ending==='Mission ready'?'The outpost is ready, with a smaller reserve for an extended stay.':'The outpost is ready, with at least two days of each resource remaining.')}<div class="task"><h3>Your task</h3>${m.reasons.length?'<ul>'+m.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul><p>Return to Module bay, revise, and recheck the affected fields.</p>':'<p>Compare the final resource reserves and explain one model limitation to your teacher.</p>'}</div><div class="badge"><span>RED HORIZON</span><strong>${esc(s.teamAlias)}</strong><span>${s.plan.water}W · ${s.plan.oxygen}O · ${s.plan.habitat}H<br>${s.plan.solar}S · ${s.plan.battery}B</span><small>Mars Colony v${MC.VERSION}</small></div>${btn('report','Print mission report & patch','primary')}${diagram()}${timeline()}</div>`}
function stage(){let n=s.currentStage;let content='';if(n===1)content=`<div class="card hero"><p class="eyebrow">A mission in systems thinking</p><h2>Make a new<br>world add up.</h2>${Art.scene(s.plan)}<p>Red Horizon · 24 settlers · 10 Earth days</p></div>${story('Twenty-four settlers are waiting to occupy a small research outpost. A dust storm is approaching. Their arrival depends on a resource system that balances.')}${task('Work in pairs. Alternate Planner and Checker each stage. Calculate resources, choose equipment, test the storm, and defend your design. Save or export at any time.')}<div class="card"><h3>Mission constraints</h3><p>Budget: <b>26,000 cr</b> · Cargo: <b>3,400 kg</b> · Habitat: <b>at least 3 m²/person</b>.</p><p>Days 4–6 have 25% less solar output. All days are 24-hour Earth days.</p><p class="notice">All rates, equipment capacities, prices, masses and the storm are invented classroom values. This model does not establish real human needs or prove a Mars colony is safe. Food is pre-delivered; demand is constant; no battery efficiency losses are modeled.</p><label>Pair alias (no real names)<input id="alias" value="${esc(s.teamAlias)}" maxlength="60"></label><p><label><input id="brief" type="checkbox" ${s.brief?'checked':''}>We understand the mission limits and fictional model.</label></p></div>`;
if(n===2)content=story('The supply team needs a clear distinction between what the settlers use each day and what must be stored.')+task('Calculate daily and ten-day demands. Then classify the units and complete both conversions. All values are exact.')+`<div class="card"><p>Per person per day: water <b>3 L</b>, oxygen <b>0.8 kg</b>, food <b>0.6 kg</b>. Population <b>24</b>; mission <b>10 days</b>.</p>${fields(2)}</div>`;
if(n===3)content=story('The first equipment shipment is ready. Whole modules must provide enough water, oxygen and living space.')+task('Calculate the minimum counts and their capacities. Choose your equipment, then calculate the floor area and occupancy of your selected habitats. A weak choice can still be analyzed.')+equipment()+fields(3);
if(n===4)content=story('The cargo lander has strict mass and credit limits. Every module and every supply item must be counted.')+task('Choose a supply crate. Total the equipment and all crate contents. Report signed budget and cargo reserves—even if a reserve is negative.')+equipment(false)+`<div class="card"><label>Supply crate <select data-plan="crate"><option value="standard" ${s.plan.crate==='standard'?'selected':''}>Standard — 1,000 cr</option><option value="lean" ${s.plan.crate==='lean'?'selected':''}>Lean — 800 cr</option></select></label><p>Both crates: 144 L water + 38.4 kg oxygen + 100 kg crate/other supplies. Standard food: 172.8 kg. Lean food: 158.4 kg. For cargo, 1 L water = 1 kg. Include all contents in mass.</p></div>`+fields(4);
if(n===5){let checked=MC.fields(5).every(f=>MC.current(s,f.id));content=story('Mission control needs a resource timeline. Production, consumption and storage tell different parts of the story.')+task('Choose one resource. Construct stock = initial + net change × t before caps. Complete the table, label the axes and enter three graph points. Apply storage caps when building the table.')+`<div class="card"><label>Resource <select id="resource">${['water','oxygen','food'].map(x=>`<option ${s.resource===x?'selected':''}>${x}</option>`).join('')}</select></label><p>Initial: water 144 L; oxygen 38.4 kg; food ${s.plan.crate==='lean'?158.4:172.8} kg. Caps: water 400 L; oxygen 100 kg; food 200 kg. Production: ${s.plan.water} × 30 L/day water; ${s.plan.oxygen} × 8 kg/day oxygen; no food production. Use: 72 L/day, 19.2 kg/day, 14.4 kg/day.</p><p>For whole days 0–10: each next stock = previous stock + net change, capped at capacity and zero. If demand cannot be met, flag the shortage. A capped timeline can flatten even though the uncapped equation is linear.</p>${fields(5)}</div>${checked?Art.graph(s)+table([0,5,10].map(d=>[d,MC.model(s.plan).days[d][s.resource]]),['Earth day',s.resource+' stock ('+(s.resource==='water'?'L':'kg')+')']):''}`}
if(n===6)content=Art.scene(s.plan,'storm')+story('A dust front crosses the landing region. Solar yield falls for days four, five and six. The equipment keeps using energy.')+task('Apply a 25% reduction to solar yield. Calculate the equipment load, normal and storm production, then the signed daily storm balance.')+`<div class="card"><p>Fixed demand: 24 kWh/day. Water: ${s.plan.water} modules × 8. Oxygen: ${s.plan.oxygen} × 12. Habitats: ${s.plan.habitat} × 10. Arrays: ${s.plan.solar} × 36 kWh/day normally. Battery stores energy; it adds no production.</p>${fields(6)}</div>`;
if(n===7)content=story('The storm tests the reserve. Mission control is considering a battery-based design and an extra-array design.')+task('Track your battery from a full start through normal days 1–3, storm days 4–6 and normal day 7. Compare the two reference designs. To change your own plan, return to Module bay; dependent answers will need rechecking.')+`<div class="card"><p>Your battery capacity: ${36*s.plan.battery} kWh. Add generation minus load each day. Discard excess above capacity; never report negative storage. Record energy demand that remains unserved after the battery empties.</p><p>Reference A: 3 water, 3 oxygen, 3 habitats, 4 arrays, 1 battery, standard crate. Reference B: same but 5 arrays, no battery.</p>${fields(7)}</div>`+reflection();
if(n===8)content=story('The mission team has submitted its proposal. Each planner now checks a new population independently.')+task('Partner A works first while B looks away. Submit A, then swap. Do not copy the earlier totals. Your teacher checks independent participation. Afterwards, finalize and print the report.')+['A','B'].map(w=>{let ids=['transfer'+w+'Water','transfer'+w+'Modules'],done=ids.every(id=>MC.current(s,id));return `<div class="card"><h3>Partner ${w} · individual transfer</h3>${done?'<p>Submitted. Responses are covered in student view; the teacher report retains them.</p>'+btn('retryTransfer','Revise response','',`data-who="${w}"`):fields(8,f=>ids.includes(f.id))+btn('transfer','Submit partner '+w,'primary',`data-who="${w}"`)}</div>`}).join('')+end();return content}
function render(){let list=sessions();$('#app').innerHTML=`<header><div><small>RED HORIZON / APPLIED MATHEMATICS</small><h1>Mars Colony <small>v${MC.VERSION}</small></h1><div id="save-status" class="save" role="status">${esc(saveMessage)}</div></div><div class="toolbar">${btn('home','Missions')}${s?btn('save','Save')+btn('export','Export progress')+btn('duplicate','Duplicate'):''}${btn('import','Import')}${btn('calculator','Calculator')}${btn('teacher','Teacher guide')}</div></header>${conflict?'<div class="notice">Newer work exists in another tab. '+btn('reload','Reload stored version')+btn('duplicate','Save as new copy')+'</div>':''}<div class="shell">${s?`<nav aria-label="Mission stages">${names.map((x,i)=>btn('stage',`${i+1}. ${x}`,'',`data-stage="${i+1}" ${s.currentStage===i+1?'aria-current="step"':''} ${i+1>s.unlocked?'disabled title="Complete preceding stage first"':''}`)).join('')}</nav><main id="main"><p class="eyebrow">${s.currentStage}/8 · ${esc(s.teamAlias||'New mission')}</p><h2>${names[s.currentStage-1]}</h2>${errors.length?`<div id="errors" class="errors" tabindex="-1" role="alert"><strong>Check these fields</strong><ul>${errors.map(e=>`<li><a href="#${e.id==='brief'?'brief':'f-'+e.id}">${esc(e.message)}</a></li>`).join('')}</ul></div>`:''}${stage()}<div class="actions">${s.currentStage>1?btn('back','Back'):''}${s.currentStage<8?btn('check','Check & continue','primary'):btn('finish','Finalize mission','primary')}${s.currentStage>1&&s.currentStage<8?btn('checkOnly','Check this stage'):''}</div></main>`:`<main class="full"><div class="card hero"><p class="eyebrow">Three lessons. One new horizon.</p><h2>Can your outpost<br>weather the storm?</h2>${Art.scene(MC.BASE)}<p>Use rates, resource models and mathematical evidence to prepare a research colony for 24 settlers.</p>${btn('new','Start a new mission','primary')}</div><div class="card"><h2>Saved missions</h2>${list.length?list.map(x=>`<div class="row"><p><strong>${esc(x.teamAlias||'Unnamed pair')}</strong> · Stage ${x.currentStage}/8</p><div>${btn('resume','Resume','',`data-id="${x.sessionId}"`)} ${btn('delete','Delete','danger',`data-id="${x.sessionId}"`)}</div></div>`).join(''):'<p>No saved missions yet.</p>'}<div class="actions">${btn('backup','Export all Mars missions')}${btn('clear','Clear all Mars saved work','danger')}</div></div></main>`}</div><footer>A WILLIAM MCADA PRODUCT · Mars Colony v${MC.VERSION} · Content / save schema 1.0.0 · No accounts or cloud sync</footer>`;if(errors.length)$('#errors')?.focus()}
function required(stage){let e=MC.check(s,stage);if(stage===7){if(!['A','B'].includes(s.notes.choice)||!s.notes.reason?.trim()||!s.notes.limitation?.trim())e.push({id:'compareCost',message:'Choose A or B and give a numerical reason and a model limitation for teacher review.'})}return e}
function download(data,name){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function printReport(){let m=MC.model(s.plan);$('#print').innerHTML=`<h1 class="print-header">Mars Colony · Mission readiness report · v${MC.VERSION}</h1><p>A WILLIAM MCADA PRODUCT · Pair ${esc(s.teamAlias)} · ${esc(m.ending)} · Teacher review of reasoning and independent work pending</p>${end()}${table(MC.KEYS.map(k=>[k,s.plan[k],MC.EQUIP[k][2]*s.plan[k],MC.EQUIP[k][3]*s.plan[k]]).concat([['Crate',s.plan.crate,MC.round(m.mass-MC.KEYS.reduce((a,k)=>a+MC.EQUIP[k][2]*s.plan[k],0)),s.plan.crate==='lean'?800:1000],['TOTAL','',m.mass,m.cost],['REMAINING','',m.cargo,m.budget]]),['Cargo item','Count / choice','Mass (kg)','Cost (cr)'],'Cargo manifest')}${Art.graph(s)}<p>Uncapped ${s.resource} stock rule: S(t)=${esc(s.inputs.initial)} + (${esc(s.inputs.net)})t; whole Earth days 0–10. Daily storage capped; shortages flagged.</p><h2 class="pagebreak">Learning evidence</h2>${table(Object.values(MC.F).map(f=>[f.id,f.label,s.checkpoints[f.id]?.first,s.inputs[f.id],MC.current(s,f.id)?'Checked':'Needs recheck']),['Field','Task','First response','Current response','Status'])}<h2>Design defense — teacher review</h2><p>Choice ${esc(s.notes.choice)}: ${esc(s.notes.reason)}</p><p>Limitation: ${esc(s.notes.limitation)}</p><p>Help used: ${s.help.map(h=>esc(h.field)).join(', ')||'None recorded'}. Model quantities are invented classroom assumptions.</p><h2 class="pagebreak">Attempt history</h2>${table(s.attempts.map(a=>[a.field,a.response,a.ok?'Correct':'Recheck',Object.entries(a.plan).map(([k,v])=>k+':'+v).join(' ')]),['Field','Response','Result','Scenario'])}`;$('#print').querySelectorAll('button').forEach(x=>x.remove());window.print()}
function teacher(){modal(`<h2>Teacher guide · v${MC.VERSION}</h2><p>Open reference—not a protected teacher login. Three estimated 45-minute lessons: demand/modules; manifest/models; storm/revision/report. Alternate pair roles. Independent transfer and reasoning need teacher review.</p><p>Demand: 72 L,19.2 kg oxygen,14.4 kg food daily; ten-day totals 720 L,192 kg,144 kg. Minimum water/oxygen/habitats:3 each. Habitat:72 m²,24 people,3 m²/person.</p><p>Baseline:25,300 cr,3,185.2 kg; reserves700 cr/214.8 kg. Load114 kWh/day; normal144; storm108; balance−6. Battery days3–7:36,30,24,18,36. Unserved0. W=144+18t; O=38.4+4.8t; F=172.8−14.4t before caps.</p><p>Baseline day10:324 L/86.4 kg/28.8 kg. Five arrays/no battery:25,500 cr,3,205.2 kg; storm surplus21 kWh/day. Both resilient. Lean crate baseline:25,100 cr,3,170.8 kg; final food14.4 kg, Mission ready. Two habitats or inadequate power:Deployment delayed.</p><p>Transfer A:90 L/day and3 water modules; B:84 L/day and3 modules. Prose, participation and real classroom timing are not automatically assessed.</p><p>All supplies/capacities are fictional. Report no physical iPad, school-network or printer result until tested. Export before device/browser changes. Clear-all affects only this project.</p>`) }
function deletion(id){let ids=id?[id]:sessions().map(x=>x.sessionId);if(!id){try{for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith(PREFIX)&&!ids.includes(k.slice(PREFIX.length)))ids.push(k.slice(PREFIX.length))}}catch{}}modal(`<h2>Delete ${ids.length} Mars mission record${ids.length===1?'':'s'}?</h2><p>This removes all progress, responses, attempts and reflections for ${id?'this pair’s entire mission':'every Mars mission on this browser'}. Other projects and downloaded backups remain unchanged. Export a backup first; deletion has no undo.</p>${btn('backup','Export backup first')} ${btn('confirmDelete','Delete '+ids.length+' records','danger')} ${btn('close','Cancel')}`);$('#dialog').dataset.ids=JSON.stringify(ids)}
async function action(a,b){errors=[];switch(a){case'new':s=MC.newSession();save();break;case'home':save();s=null;break;case'resume':s=structuredClone(sessions().find(x=>x.sessionId===b.dataset.id));conflict=false;break;case'save':save();break;case'duplicate':s=structuredClone(s);s.sessionId=MC.newSession().sessionId;s.revision=0;s.completedAt=null;conflict=false;save();break;case'reload':try{s=MC.validate(JSON.parse(localStorage.getItem(PREFIX+s.sessionId)));conflict=false}catch{saveMessage='Could not reload; export your current work.'}break;case'stage':s.currentStage=Number(b.dataset.stage);save();break;case'back':s.currentStage--;save();break;case'check':case'checkOnly':if(s.currentStage===1){if(!s.teamAlias.trim()||!s.brief)errors=[{id:'brief',message:'Enter a pair alias and confirm the mission briefing.'}]}else errors=required(s.currentStage);if(!errors.length&&a==='check'){s.currentStage++;s.unlocked=Math.max(s.unlocked,s.currentStage)}save();break;case'finish':if(!allChecked())errors=[{id:'transferAWater',message:'Complete both transfers and recheck pending fields in earlier stages.'}];else{s.completedAt=new Date().toISOString()}save();break;case'transfer':errors=MC.check(s,8,['transfer'+b.dataset.who+'Water','transfer'+b.dataset.who+'Modules']);save();break;case'retryTransfer':for(let id of ['transfer'+b.dataset.who+'Water','transfer'+b.dataset.who+'Modules']){s.checkpoints[id].ok=false}save();break;case'help':{let f=MC.F[b.dataset.id];s.help.push({field:f.id,at:new Date().toISOString()});save();modal(`<h2>${esc(f.label)}</h2><h3>Meaning & format</h3><p>${esc(f.label)}. ${esc(f.unit)}. ${f.options?'Select the appropriate label.':'Use an exact number or equivalent fraction.'}</p><h3>Method & different-number example</h3><p>${esc(f.help)}</p>`);return}case'export':download(s,'MarsColony-v0.1.0-progress.json');return;case'backup':download({projectId:'mars-colony',backupVersion:1,sessions:sessions()},'MarsColony-v0.1.0-backup.json');return;case'import':$('#import').click();return;case'commitImport':{let old=[];try{for(let x of pendingImport){let y=structuredClone(x);y.sessionId=MC.newSession().sessionId;y.revision=1;localStorage.setItem(PREFIX+y.sessionId,JSON.stringify(y));old.push(y.sessionId)}pendingImport=[];saveMessage='Imported new mission copies; existing work retained.';close();s=null}catch{for(let id of old){try{localStorage.removeItem(PREFIX+id)}catch{}}modal('<h2>Import not saved</h2><p>Device storage is unavailable or full. Current work was not replaced. Keep the original backup.</p>');return}break}case'delete':deletion(b.dataset.id);return;case'clear':deletion();return;case'confirmDelete':{let ids=JSON.parse($('#dialog').dataset.ids);try{for(let id of ids){localStorage.removeItem(PREFIX+id);delete memory[id]}saveMessage='Selected Mars records deleted.'}catch{saveMessage='Deletion could not complete. Remaining records are still shown.'}close();break}case'close':close();return;case'teacher':teacher();return;case'report':printReport();return;case'calculator':modal(`<h2>Calculator</h2><p>Enter exact decimals or fractions; copy a result into your work. This tool does not mark answers.</p><input id="calcA" aria-label="First number"><select id="calcOp" aria-label="Operation"><option>+</option><option>−</option><option>×</option><option>÷</option></select><input id="calcB" aria-label="Second number">${btn('calculate','Calculate')}<p id="calcResult" role="status"></p>`);return;case'calculate':{let x=MC.number($('#calcA').value),y=MC.number($('#calcB').value),op=$('#calcOp').value,z=op==='+'?x+y:op==='−'?x-y:op==='×'?x*y:y===0?NaN:x/y;$('#calcResult').textContent=Number.isFinite(z)?String(MC.round(z)):'Enter valid values; division by zero is undefined.';return}}
render();}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b)});
document.addEventListener('change',e=>{let x=e.target;if(!s)return;if(x.dataset.field){s.inputs[x.dataset.field]=x.value;s.completedAt=null;save();return}if(x.dataset.note){s.notes[x.dataset.note]=x.value;s.completedAt=null;save();return}if(x.dataset.plan){let k=x.dataset.plan,v=k==='crate'?x.value:Number(x.value);if(k!=='crate'&&(x.value===''||!Number.isInteger(v)||v<0||v>12)){x.setCustomValidity('Use a whole count from 0 to 12.');x.reportValidity();x.value=s.plan[k];return}x.setCustomValidity('');s.plan[k]=v;s.completedAt=null;save();render()}if(x.id==='resource'){s.resource=x.value;save();render()}if(x.id==='alias'){s.teamAlias=x.value;save()}if(x.id==='brief'){s.brief=x.checked;save()}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
$('#dialog').addEventListener('close',()=>opener?.focus());
$('#import').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>2*1024*1024)throw Error('Import limit is 2 MB.');let data=JSON.parse(await f.text()),arr=data.backupVersion===1&&data.projectId==='mars-colony'?data.sessions:[data];if(!Array.isArray(arr)||!arr.length||arr.length>100)throw Error('Import 1–100 missions at a time.');pendingImport=arr.map(MC.validate);modal(`<h2>Review import</h2><p>${pendingImport.length} validated Mars missions will be added as new copies. Existing work stays unchanged. Only schema/content 1.0.0 is supported; compatible app patches are accepted.</p>${btn('commitImport','Import copies','primary')}`)}catch(err){modal('<h2>Import rejected</h2><p>'+esc(err.message)+'</p><p>Your existing work is unchanged.</p>')}});
window.addEventListener('storage',e=>{if(s&&e.key===PREFIX+s.sessionId){conflict=true;saveMessage='Another tab changed this mission. Reload or save as a copy.';render()}});
render();return {get session(){return s},get errors(){return errors},render,save,allChecked};
})();
