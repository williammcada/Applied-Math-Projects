 for(const t of [0,1,3,6,10,...(r.boundary!==null&&![0,1,3,6,10].includes(r.boundary)?['boundary']:[])]){try{let x=teacher?(t==='boundary'?r.boundary:t):C.numeric(s.inputs[t==='boundary'?'boundaryX':'pointX'+t]||'','days').num(),y=teacher?m.days[x].stocks[s.resource]:C.numeric(s.inputs[t==='boundary'?'boundaryY':'pointY'+t]||'',u).num();if(x>=0&&x<=10&&y>=0&&y<=r.cap)b+=`<circle cx="${px(x)}" cy="${py(y)}" r="5" fill="#a64f36"/>`;}catch{}}
 return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${C.names[s.resource]} stock graph; values are available in the resource table"><title>Daily retained stock, with capacity applied. Lines between days are illustrative.</title>${b}</svg>`;}
function stockWork(){return fields(['stock_initial','stock_production','stock_consumption','stock_net','stock_rule','stock_meaning','boundary'])+`<h4>End-of-day resource ledger</h4><p class="muted">Retain no more than the storage cap. Record all unmet demand and discarded surplus. Use 0 when none occurs.</p><table class="data-table stock-table"><thead><tr><th>Day</th><th>Retained stock</th><th>Unmet demand</th><th>Discarded</th></tr></thead><tbody>${Array.from({length:11},(_,t)=>`<tr><td>${t}</td><td>${field('stock_day'+t,true)}</td><td>${t?field('unmet_day'+t,true):'—'}</td><td>${t?field('discarded_day'+t,true):'—'}</td></tr>`).join('')}</tbody></table><h4>Build your graph</h4>${fields(['axisX','axisY',...[0,1,3,6,10].flatMap(t=>['pointX'+t,'pointY'+t]),'boundaryX','boundaryY'])}<div class="actions">${btn('Plot my points','plot')}</div>${graph(session)}`;}
function batteryWork(){const m=C.model(session.cfg);return fields(['batteryCap','batteryInitial','stormDeficit'])+m.days.slice(1).map(d=>`<section class="energy-day ${d.storm?'storm':''}"><h4>Day ${d.day} ${d.storm?'· reduced solar output':''}</h4><p class="muted">Checked generation ${d.generation} kWh/day · load ${m.load} kWh/day · balance ${d.balance} kWh/day. This row covers one Earth day.</p>${fields(['start','battery','unserved','curtailed'].map(k=>k+'_day'+d.day))}</section>`).join('')+fields(['allCovered']);}
function stageContent(){const s=session,m=C.model(s.cfg),n=s.currentStage;
 if(n===1)return `<p class="lead">Your pair is the mission-planning team. Twenty-four settlers are waiting for an initial research outpost to be ready.</p><div class="facts"><div><strong>26,000 cr</strong><span>budget cap</span></div><div><strong>3,400 kg</strong><span>cargo cap</span></div><div><strong>Days 4–6</strong><span>25% less solar output</span></div></div><div class="fields">${[['teamAlias','Mission / team alias'],['learnerA','Learner A alias'],['learnerB','Learner B alias']].map(([k,l])=>`<div class="field"><label for="meta-${k}">${l}</label><input class="meta-input" id="meta-${k}" data-meta="${k}" value="${esc(s[k])}" maxlength="40"></div>`).join('')}<div class="field"><label for="meta-planner">Who plans first?</label><select class="meta-input" id="meta-planner" data-meta="planner"><option value="A" ${s.planner==='A'?'selected':''}>Learner A</option><option value="B" ${s.planner==='B'?'selected':''}>Learner B</option></select></div></div><div class="note"><strong>Our model, clearly stated</strong><p>All rates, equipment, costs and masses are authored classroom data. One day means 24 Earth hours. Food is delivered in advance, batteries start full, and daily accounting omits losses and hourly operation.</p><p>Daily water and oxygen production must meet demand. Housing, food, energy, budget and cargo must also work. Two final reserve days in each material resource earn a Resilient outpost.</p></div><label class="checks"><input type="checkbox" data-meta="brief" ${s.brief?'checked':''}> We understand the fixed mission, the limits and the scheduled storm.</label><p class="muted">The Planner enters and explains. The Checker checks quantities and units. Swap after lessons 1 and 2. Help and mathematical revisions are unlimited.</p>`;
 if(n===2)return `<p class="lead">Before choosing equipment, work out what the settlers need.</p>${givenTable()}${group('C01')}<div class="note">Conversion relationships: 1 kg = 1,000 g; 1 L = 1,000 mL. A total is a stock; an amount per day is a rate.</div>${group('C02')}`;
 if(n===3)return `<p class="lead">Find the minimum whole modules. Then select the equipment for your own plan.</p><div class="note">One oxygen module: 8 kg/day. One water module: 30 L/day. A habitat provides 8 places and 24 m²; each settler needs at least 3 m².</div>${group('C03')}<h3>Your provisional equipment</h3><p class="muted">All selected equipment is counted in cargo and cost. Below-minimum choices are allowed for analysis. You can revise this plan after testing it.</p>${equipment()}${group('C04')}`;
 if(n===4)return `<p class="lead">Every module and every supply must fit two separate limits.</p>${packs()}<table class="data-table"><caption>Selected equipment · given unit prices and masses</caption><thead><tr><th>Equipment</th><th>Count</th><th>Mass each</th><th>Cost each</th></tr></thead><tbody>${C.catalog.map(([k,l,c,e,m,p])=>`<tr><td>${l}</td><td>${s.cfg[k]}</td><td>${m} kg</td><td>${p} cr</td></tr>`).join('')}</tbody></table><p class="note">Cargo cap: 3,400 kg. Budget: 26,000 cr. A negative reserve means an overrun. It is a valid answer when the calculation is correct.</p>${group('C08')}`;
 if(n===5)return `<p class="lead">Build a stock rule, then follow one resource through all ten days.</p><label for="resource"><strong>Resource to model</strong></label><select class="meta-input" id="resource" data-resource>${Object.entries(C.names).map(([k,v])=>`<option value="${k}" ${s.resource===k?'selected':''}>${v} · ${C.units[k]} stock</option>`).join('')}</select><div class="note">Initial ${C.names[s.resource].toLowerCase()}: ${m.resources[s.resource].initial} ${C.units[s.resource]}. Storage cap: ${m.resources[s.resource].cap} ${C.units[s.resource]}. Use your selected modules and checked daily demand. Food has no daily production. Apply daily net change before the storage cap.</div>${group('C05',stockWork())}${C.groupOK(s,'C05')?system(s):''}`;
 if(n===6)return `<p class="lead">Dust reduces solar output on days 4, 5 and 6. The event happens once; it was disclosed in the mission brief.</p><div class="note">Each array normally produces 36 kWh/day. Storm reduction: 25%. Other fixed load: 24 kWh/day. Oxygen modules use 12, water modules 8, and habitats 10 kWh/day each. Batteries store energy; they are not generators.</div>${group('C06')}`;
 if(n===7)return `<p class="lead">Will the daily system keep working? Trace the batteries, compare two strategies, then choose your final configuration.</p>${group('C07',C.groupOK(s,'C06')?batteryWork():`<p class="note bad">Recheck C06 after changing power inputs before calculating the battery ledger.</p>`)}<h3>Two fair comparisons</h3><div class="note">Both strategies use 3 oxygen modules, 3 water modules, 3 habitats and your ${esc(s.cfg.pack)} crate. A uses 4 arrays + 1 battery. B uses 5 arrays + 0 batteries. These comparison plans remain fixed while your personal plan can change.</div>${group('C09')}<details><summary>Revise my equipment or supply pack</summary>${equipment()}${packs()}<p class="muted">Changed inputs keep your earlier answers, marked Needs recheck. Revisit affected stages before finishing.</p></details>${system(s)}`;
 const out=C.outcome(s);return `<div class="outcome"><div><div class="eyebrow">Mission readiness</div><h2>${out.title}</h2><p>${out.code==='draft'?'Finish or recheck '+out.missing.join(', ')+'. Your current calculated projection is '+m.ending.toLowerCase()+'.':out.code==='provisional'?'A required gate was bypassed. Teacher review is needed; the mathematical projection is '+m.ending.toLowerCase()+'.':endingText(m)}</p></div>${A.patch(esc(s.teamAlias),s.cfg,out.title)}</div>${criteria(m)}${system(s)}<div class="actions">${btn('Print mission report','report','','primary')}${btn('Mission patch','patch')}${btn('Review my equipment','revise')}</div><div class="note"><strong>Individual evidence</strong><p>The pair’s design outcome is separate from each learner’s transfer response. On-device: one learner at a time. Paper: print the slips, then ask the teacher to record the review.</p>${btn('Print transfer slips','slips')}</div>${group('C10',transferWork())}<p class="muted">Interpretations, benefits and limitations are submitted for teacher review. Final corrected work is not a claim of independent mastery.</p>`;
}
function transferWork(){return ['A','B'].map(w=>`<section class="energy-day"><h3>${esc(session['learner'+w]||'Learner '+w)}</h3><p>${w==='A'?'30 settlers use 3 L of water each per day. A module supplies 30 L/day.':'28 settlers use 0.8 kg of oxygen each per day. A module supplies 8 kg/day.'} Calculate daily demand, ten-day demand, the ratio and minimum whole modules.</p>${field('transferMode'+w)}${session.inputs['transferMode'+w]==='paper'?`<p class="note">Paper assigned · ${C.reviewStatus(session,'transferMode'+w)==='verified'?'teacher review recorded':'pending teacher review'}. Printing a slip does not mark it correct.</p>`:fields(['daily','total','ratio','count','reason'].map(k=>'transfer'+w+'_'+k))}</section>`).join('');}
function criteria(m){return `<div class="criteria">${m.criteria.map(([k,pass,detail])=>`<div class="criterion ${pass?'':'failed'}"><strong>${pass?'✓ Meets':'! Revisit'} · ${k}</strong><small>${esc(detail)}</small></div>`).join('')}</div>`;}
function endingText(m){const c=m.cfg;if(!m.ready)return 'Deployment is delayed. Use the criteria below to find the exact shortfall or overrun. You can revise without restarting.';const low=Object.entries(m.resources).filter(([k,r])=>r.reserve.cmp(2)<0).map(([k,r])=>`${k}: ${nfmt(r.reserve)} day(s)`);return `${c.a} arrays and ${c.b} batteries cover every modeled daily load. End-of-storm stored energy is ${m.days[6].battery} kWh. ${low.length?'Limited final reserve — '+low.join('; ')+'.':'Water, oxygen and food each retain at least two days of reserve.'} This daily model does not establish real continuous operation.`;}
function render(){const s=session;$('#app').innerHTML=header()+(message?`<div class="message" role="status">${esc(message)}</div>`:'')+(s?`<div class="workspace"><aside class="sidebar"><div class="mission-tag"><strong>${esc(s.teamAlias||'New mission')}</strong><small>24 settlers · 10 Earth days</small></div><nav class="stage-nav" aria-label="Mission stages">${C.stages.map((name,i)=>`<button data-stage="${i+1}" class="${s.currentStage===i+1?'active':''}" ${i+1>s.maxStage?'disabled title="Complete the previous stage first"':''} ${s.currentStage===i+1?'aria-current="step"':''}><span class="stepnum">${i+1}</span>${name}</button>`).join('')}</nav><div class="note"><strong>Planner: ${esc(s['learner'+s.planner]||s.planner)}</strong><br>Checker: ${esc(s['learner'+(s.planner==='A'?'B':'A')]||'partner')}<p>One action at a time. Help and revisions carry no penalty.</p></div></aside><main id="main" class="main-card" tabindex="-1"><div class="stage-banner"><div><div class="eyebrow">Chapter ${s.currentStage} of 8 · v${C.VERSION}</div><h2>${C.stages[s.currentStage-1]}</h2></div>${A.scene(s.currentStage,s.cfg,s.currentStage===8?C.outcome(s).code:'intro')}</div><div class="content">${errors.length?`<div id="errors" role="alert" tabindex="-1"><h3>Review these responses</h3><ul>${errors.map(e=>`<li>${e.key?`<a href="#f-${esc(e.key)}">${esc(e.message)}</a>`:esc(e.message)}</li>`).join('')}</ul></div>`:''}${stageContent()}</div><div class="stage-actions">${btn('← Back','back',s.currentStage===1?'disabled':'')}<span>${s.currentStage===8?btn('Finish and save','finish','','primary'):btn('Check & continue →','next','','primary')}</span></div></main></div>`:home())+footer();}
function show(title,body){focusReturn=document.activeElement;const d=$('#dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2>${btn('✕','close','aria-label="Close dialog"')}</div><div class="dialog-body">${body}</div>`;if(!d.open)d.showModal();d.querySelector('button')?.focus();}

function summaryErrors(){render();if(errors.length)$('#errors').focus();}
function checkGroup(g){errors=C.check(session,g);save();summaryErrors();}
function next(){errors=[];const s=session,n=s.currentStage;if(n===1){for(const k of ['teamAlias','learnerA','learnerB'])if(!s[k].trim())errors.push({message:'Enter '+({teamAlias:'a team alias',learnerA:'Learner A’s alias',learnerB:'Learner B’s alias'})[k]+'.'});if(!s.brief)errors.push({message:'Confirm the mission assumptions.'});}else{for(let stage=2;stage<=n;stage++)for(const g of C.stageGroups(stage)){if(stage===n)errors.push(...C.check(s,g));else if(!C.groupOK(s,g))errors.push({message:'Recheck '+g+' in '+C.stages[stage-1]+'.'});}}
 if(errors.length){save();summaryErrors();return;}if(n===5&&!s.initialPlan)s.initialPlan={cfg:C.clone(s.cfg),resource:s.resource,at:C.now()};if([3,5].includes(n)){const lesson=n===3?1:2;if(!s.lessonSwaps.includes(lesson)){s.lessonSwaps.push(lesson);s.planner=s.planner==='A'?'B':'A';message='Lesson '+lesson+' complete. Export your progress and swap Planner / Checker roles.';}}
 s.currentStage=Math.min(8,n+1);s.maxStage=Math.max(s.maxStage,s.currentStage);save();render();$('#main').focus();window.scrollTo(0,0);}
function download(data,name){const text=typeof data==='string'?data:JSON.stringify(data,null,2),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportProgress(){if(!session)throw Error('Start or resume a mission first.');save();download(session,'MarsColony_'+session.sessionId+'.json');}
function sessions(){save();const list=store.list();show('Saved missions',`<p>Each mission includes its inputs, both learners, revisions and full evidence history.</p><div class="actions">${btn('New mission','new','','primary')}${btn('Import progress','import')}${btn('Export all backup','backup')}${btn('Clear all Mars work','clearAll','','danger')}</div>${list.length?list.map(({id,session:s,error})=>`<div class="session"><strong>${esc(s?.teamAlias||'Unreadable saved mission')}</strong><p class="muted">${error?esc(error):'Chapter '+s.currentStage+' · '+esc(s.updatedAt)}</p><div class="actions">${!error?btn('Resume','resume',`data-id="${esc(id)}"`)+btn('Duplicate','duplicate',`data-id="${esc(id)}"`):''}${btn('Delete','delete',`data-id="${esc(id)}"`,'danger')}</div></div>`).join(''):'<p class="note">No saved missions on this device. You can create a new one or import a backup.</p>'}${session&&!store.available?btn('Clear current in-memory mission','clearMemory','','danger'):''}<p class="muted">Recovery after deletion requires an exported backup. Other projects and downloaded files are preserved.</p>`);}
function confirmDeletion(ids,memory=false){deleteIds=ids;const names=ids.map(id=>{try{return store.read(id)?.teamAlias||id;}catch{return id;}});show('Delete saved work?',`<p class="danger-note">Delete ${memory?'the current in-memory mission':ids.length+' complete Mars mission(s)'}? ${esc(names.join(', '))}<br>Inputs, attempts, learner responses, revisions and reviews will be removed. Downloaded files and other projects remain. Recovery requires an exported backup.</p><div class="actions">${btn('Export backup first','backup')}${btn('Cancel','close')}${btn('Confirm deletion',memory?'confirmMemory':'confirmDelete','','danger')}</div>`);}
function backup(){const ss=store.list().filter(x=>x.session).map(x=>x.session);if(session&&!ss.some(x=>x.sessionId===session.sessionId))ss.push(C.clone(session));if(!ss.length)throw Error('There is no readable work to back up.');for(let i=0;i<ss.length;i+=25)download(C.bundle(ss.slice(i,i+25)),'MarsColony_backup_'+(i/25+1)+'.json');}
function importFile(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{try{const f=input.files[0];if(!f)return;if(f.size>5*1024*1024)throw Error('Use a file no larger than 5 MiB.');pendingImport=C.parseImport(await f.text());show('Review import',`<p>${pendingImport.length} mission(s) validated:</p><ul>${pendingImport.map(s=>`<li>${esc(s.teamAlias)} · chapter ${s.currentStage}</li>`).join('')}</ul><p>Import creates new copies. Existing missions stay intact. Current answers are rechecked against this content version.</p><div class="actions">${btn('Cancel','close')}${btn('Import copies','importCopies','','primary')}</div>`);}catch(e){show('Import not completed',`<p>${esc(e.message)}</p><p>Your current mission has not been changed.</p>`);}});input.click();}
function importCopies(){if(!pendingImport)return;const copies=pendingImport.map(s=>C.duplicate(s));if(store.available)store.saveMany(copies);else if(copies.length>1)throw Error('Storage is unavailable. Import one mission at a time and export before leaving.');clearTimeout(saveTimer);session=copies[0];pendingImport=null;message='Imported as a new copy. Existing work was preserved.';close();save();render();}

function teacher(){if(!session){show('Teacher preparation',`<p>Three proposed 45-minute lessons. Use aliases, swap pair roles at lesson boundaries, and collect individual transfer evidence.</p><p>Start a mission to view its evidence or log a review. Teacher controls in a local HTML file are a classroom aid, not secure authentication.</p><div class="actions">${btn('Print reference','teacherPrint')}${btn('Diagnostics','diagnostics')}${btn('Transfer slips','slips')}</div>`);return;}
 show('Teacher desk',`<p class="note">Local teacher controls are not secure authentication. Answers are visible in the reference. Bypasses are logged and make pair outcomes Provisional.</p><div class="actions">${btn('Answer reference','teacherPrint')}${btn('Mission report','report')}${btn('Diagnostics','diagnostics')}${btn('Transfer slips','slips')}</div><h3>Evidence overview</h3>${evidenceSummary(session)}<h3>Review a response</h3><label>Response<select id="review-key">${[['reason','Recommendation benefit/tradeoff'],['limitation','Model limitation'],['revisionReason','Revision reason'],['transferA_reason','Learner A justification'],['transferB_reason','Learner B justification'],['transferModeA','Learner A paper work'],['transferModeB','Learner B paper work']].map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><label>Teacher alias<input id="reviewer" maxlength="40"></label><label>Note / oral response<textarea id="review-note" maxlength="1000"></textarea></label><label>Status<select id="review-status"><option value="verified">Reviewed</option><option value="revise">Needs revision</option><option value="pending">Pending</option></select></label>${btn('Record review','review','','primary')}<h3>Bypass a faulty or inaccessible gate</h3><label>Checkpoint<select id="bypass-group">${Object.entries(C.labels).map(([k,l])=>`<option value="${k}">${k} · ${l}</option>`).join('')}</select></label><p class="muted">Use the teacher alias and note above as the bypass record.</p>${btn('Log teacher bypass','bypass','','danger')}<h3>Record an oral response</h3><p class="muted">Choose a prose response above, enter the student’s oral response in the note, then record it as submitted work.</p>${btn('Record oral response','oral')}`);
}
function evidenceSummary(s){return `<table class="data-table"><thead><tr><th>Objective</th><th>Current</th><th>First checks</th><th>Help</th></tr></thead><tbody>${Object.keys(C.labels).map(g=>{const attempts=s.attempts.filter(a=>a.checkpoint===g),first=[...new Map(attempts.slice().reverse().map(a=>[a.key+'|'+a.fingerprint,a])).values()],passed=first.filter(a=>a.passed).length;return `<tr><td>${g} ${C.labels[g]}</td><td>${C.groupOK(s,g)?'Current':'Missing / stale'}</td><td>${passed}/${first.length} initially correct</td><td>${s.support.filter(x=>x.group===g).length}</td></tr>`;}).join('')}</tbody></table><p class="muted">First checks are grouped by field and input context. Corrections remain in the portable history. Prose “current” means submitted, not automatically graded.</p>`;}
function credit(s){return `<p class="print-credit">A WILLIAM MCADA PRODUCT · Mars Colony ${C.VERSION} · Content ${C.CONTENT} · ${esc(s?.teamAlias||'Teacher reference')} · Classroom simulation / 24-hour Earth days</p>`;}
function resourceTable(m){return `<table class="data-table"><caption>Retained stocks at the end of each day</caption><thead><tr><th>Day</th><th>Water (L)</th><th>Oxygen (kg)</th><th>Food (kg)</th></tr></thead><tbody>${m.days.map(d=>`<tr><td>${d.day}</td><td>${d.stocks.water}</td><td>${d.stocks.oxygen}</td><td>${d.stocks.food}</td></tr>`).join('')}</tbody></table>`;}
function energyTable(m){return `<table class="data-table"><caption>One row per Earth day · energy columns in kWh; generation/load are the amounts over that one day</caption><thead><tr><th>Day</th><th>Solar</th><th>Load</th><th>Start</th><th>End</th><th>Unserved</th><th>Curtailed</th></tr></thead><tbody>${m.days.slice(1).map(d=>`<tr><td>${d.day}${d.storm?' *':''}</td><td>${d.generation}</td><td>${m.load}</td><td>${d.start}</td><td>${d.battery}</td><td>${d.unserved}</td><td>${d.curtailed}</td></tr>`).join('')}</tbody></table><p class="muted">* Days 4–6: 25% reduction. Daily accounting omits nighttime operation and losses.</p>`;}
function studentReport(){if(!session)throw Error('Start or resume a mission first.');const s=session,out=C.outcome(s),m=out.model,D=C.definitions(s);let html=`<section class="paper"><div class="eyebrow">Red Horizon / mission readiness report</div><h1>${esc(s.teamAlias||'Untitled mission')}</h1><h2>${out.title}</h2><p>${esc(endingText(m))}</p><p>Learners: ${esc(s.learnerA)} / ${esc(s.learnerB)}. Created from revision ${s.revision}; report date ${new Date().toLocaleDateString()}.</p><div class="note">Classroom simulation: capacities, rates, costs and masses are invented. 24 settlers; 10 Earth days; constant demand; pre-delivered food; full batteries; no modeled efficiency losses. Resource production assumes full module power.</div>${criteria(m)}<table class="data-table"><thead><tr><th>Equipment</th><th>Count</th><th>Cargo (kg)</th><th>Cost (cr)</th></tr></thead><tbody>${C.catalog.map(([k,l,cap,e,kg,cr])=>`<tr><td>${l}</td><td>${s.cfg[k]}</td><td>${kg*s.cfg[k]}</td><td>${cr*s.cfg[k]}</td></tr>`).join('')}<tr><td>${esc(s.cfg.pack)} supply crate</td><td>1</td><td>${m.packMass}</td><td>${m.packCost}</td></tr><tr><th>Total</th><td></td><td>${m.mass}</td><td>${m.cost}</td></tr><tr><th>Reserve</th><td></td><td>${m.cargoReserve}</td><td>${m.budgetReserve}</td></tr></tbody></table>${credit(s)}</section>`;
 html+=`<section class="paper"><h2>Resources and model</h2>${system(s,true)}<p>Student rule (${C.names[s.resource]}): <strong>${esc(s.inputs.stock_rule||'Not submitted')}</strong> · ${C.fieldState(s,'stock_rule')}</p>${graph(s,false)}${resourceTable(m)}<p>Final stock alone covers: water ${nfmt(m.resources.water.reserve)} days; oxygen ${nfmt(m.resources.oxygen.reserve)}; food ${nfmt(m.resources.food.reserve)}. Exact thresholds are used.</p><p>Cap/shortage ledger: ${m.days.slice(1).flatMap(d=>Object.entries(d.resources).filter(([k,r])=>r.unmet||r.discarded).map(([k,r])=>`Day ${d.day} ${k}: ${r.unmet} unmet, ${r.discarded} discarded ${C.units[k]}`)).join('; ')||'No material shortages or discarded surplus.'}</p>${credit(s)}</section>`;
 html+=`<section class="paper"><h2>Energy and storm resilience</h2><p>Load ${m.load} kWh/day; normal generation ${m.normal}; storm ${m.storm}. Usable battery capacity ${m.batteryCap} kWh, initially full.</p>${energyTable(m)}<h3>Comparison and recommendation</h3><p>A: 4 arrays + 1 battery; B: 5 arrays + 0 batteries. Both use 3 oxygen, 3 water and 3 habitat modules with the ${s.cfg.pack} pack.</p><table class="data-table"><thead><tr><th>Quantity</th><th>A · submitted</th><th>B · submitted</th></tr></thead><tbody>${['normal','storm','load','battery','cost','mass','food'].map(k=>`<tr><td>${k}</td><td>${esc(s.inputs['compareA_'+k]||'—')}</td><td>${esc(s.inputs['compareB_'+k]||'—')}</td></tr>`).join('')}</tbody></table><p>Recommendation: ${esc(s.inputs.recommend||'—')}; evidence ${esc(s.inputs.evidenceValue||'—')} (${esc(s.inputs.metric||'—')}).</p>${['reason','limitation','revisionReason'].map(k=>`<p><strong>${D[k].label}:</strong> ${esc(s.inputs[k]||'Not submitted')} <em>Review: ${C.reviewStatus(s,k)}</em></p>`).join('')}<h3>Initial and final configuration</h3><p>Initial: ${s.initialPlan?esc(JSON.stringify(s.initialPlan.cfg)):'Not yet frozen'}<br>Final: ${esc(JSON.stringify(s.cfg))}<br>${s.revisions.length} recorded configuration edits; full context is retained in progress export.</p>${credit(s)}</section>`;
 html+=`<section class="paper"><h2>Learning evidence</h2>${evidenceSummary(s)}<h3>Individual transfer</h3>${['A','B'].map(w=>`<p><strong>${esc(s['learner'+w]||w)}</strong> · ${esc(s.inputs['transferMode'+w])}: ${s.inputs['transferMode'+w]==='paper'?'Paper review: '+C.reviewStatus(s,'transferMode'+w):['daily','total','ratio','count','reason'].map(k=>`${k}: ${esc(s.inputs['transfer'+w+'_'+k]||'—')}`).join('; ')}</p>`).join('')}<p>Corrected shared work is not independent mastery. Teacher overrides: ${s.teacherOverrides.length}.</p>${s.teacherOverrides.map(o=>`<p>${esc(o.group)} · ${esc(o.reviewer)} · ${esc(o.reason)}</p>`).join('')}<h3>Teacher review record</h3>${s.reviews.length?s.reviews.map(r=>`<p>${esc(r.key)} · ${esc(r.status)} · ${esc(r.reviewer)}: ${esc(r.note)}</p>`).join(''):'<p>Pending; no teacher review recorded.</p>'}${credit(s)}</section>`;
 html+=`<section class="paper"><h2>Response record</h2><p>First checked response for each current field; latest entry and current status. Previous scenario attempts remain in JSON export.</p><table class="data-table"><thead><tr><th>Field</th><th>First checked</th><th>Current response</th><th>Status</th></tr></thead><tbody>${Object.entries(D).filter(([k,d])=>d.active).map(([k,d])=>{const first=s.attempts.find(a=>a.key===k);return `<tr><td>${d.g} · ${esc(d.label)}</td><td>${first?esc(first.response)+(first.passed?' ✓':' · revise'):'—'}</td><td>${esc(s.inputs[k]||'—')}</td><td>${C.fieldState(s,k)}</td></tr>`;}).join('')}</tbody></table>${credit(s)}</section>`;return html;
}
function teacherReference(){const m=C.model(),b=C.model({o:3,w:3,h:3,a:5,b:0,pack:'standard'}),demo=C.newSession();demo.cfg={o:3,w:3,h:3,a:4,b:1,pack:'standard'};const D=C.definitions(demo);return `<section class="paper"><h1>Mars Colony — Teacher Reference</h1><p>Three proposed 45-minute lessons for advanced Grade 5 / Saxon 8/7. Pairs share a device and swap Planner/Checker after stages 3 and 5. Collect separate transfer evidence. On-screen help and revisions are unpenalized.</p><div class="note">Classroom model, not engineering guidance. Daily self-sufficient water/oxygen production is required even if initial supplies could cover a shortfall. Battery storage is not daily production. Days 4–6 replace normal output; they are not additional days.</div>${givenTable()}<p>Ten-day totals: 720 L water; 192 kg oxygen; 144 kg food. Minimum modules: 3 water, 3 oxygen, 3 habitats. Ratios 2.4 water/oxygen; 3 habitat. 72 m² / 24 = 3 m²/person.</p><p>Baseline: 3 oxygen + 3 water + 3 habitats + 4 arrays + 1 battery; standard crate. Cost 25,300 cr; cargo 3,185.2 kg. Reserves 700 cr / 214.8 kg. Load 114 kWh/day; normal output 144, storm output 108.</p>${resourceTable(m)}${credit()}</section><section class="paper"><h2>Reference energy and alternatives</h2>${energyTable(m)}<p>Water W(t)=144+18t; oxygen O(t)=38.4+4.8t; food F(t)=172.8−14.4t. Apply caps 400 L / 100 kg / 200 kg. At day 10: 324 / 86.4 / 28.8. Final reserve days: 4.5 / 4.5 / 2.</p><p>Five arrays, no battery: 180 normal, 135 storm, 114 load; 25,500 cr / 3,205.2 kg. Resilient outpost. It costs 200 cr / 20 kg more than baseline; daily energy accounting omits nighttime requirements.</p><p>Lean baseline: cost 25,100; cargo 3,170.8; final food 14.4 kg, one day → Mission ready. Lean five-array plan: 25,300 / 3,190.8. Lean four-array/two-battery plan: 25,900 / 3,250.8; day-6 battery 54 → Mission ready.</p><p>Four arrays without a battery fail days 4–6 by 6 kWh/day. Three arrays without a battery already fail a normal day by 6, and storm days by 33. Two habitats: 16 places, 48 m². Two water modules leave 24 L at day 10 but fail the required daily-production criterion.</p><h3>Outcomes</h3><p>Critical criteria: housing, daily water/oxygen production, food, nonnegative/capped stores, every day’s energy, cost ≤26,000 and cargo ≤3,400. All pass plus ≥2 final reserve days for each material → Resilient outpost. All pass but a lower material reserve → Mission ready. Otherwise Deployment delayed. Missing/stale work → Draft; bypass → Provisional.</p><h3>Individual transfer</h3><p>A: 90 L/day; 900 L; ratio 3; 3 modules. B: 22.4 kg/day; 224 kg; ratio 2.8; 3 modules. Paper work remains pending until reviewed.</p>${credit()}</section><section class="paper"><h2>Baseline answer reference</h2><p>Equivalent exact fractions and linear expressions pass. The values below use the standard baseline and water as the selected model. Personal configurations produce different valid answers.</p><table class="data-table"><thead><tr><th>Checkpoint/field</th><th>Expected response</th></tr></thead><tbody>${Object.entries(D).filter(([k,d])=>d.active).map(([k,d])=>`<tr><td>${d.g} · ${esc(d.label)}</td><td>${d.kind==='expression'?'144+18t':d.kind==='number'?exact(d.expected)+(d.unit?' '+esc(d.unit):''):d.kind==='select'?esc(d.options.find(x=>x[0]===d.expected)?.[1]):d.kind==='text'?'Student evidence; teacher review':'Any declared choice'}</td></tr>`).join('')}</tbody></table>${credit()}</section>`;}
function slips(){return `<section class="paper"><h1>Mars Colony — Individual Transfer</h1><p>Work independently. Use the given relationships and show your capacity reasoning.</p>${['A','B'].map(w=>`<section style="padding:25px 0;border-top:1px solid #aaa"><h2>Learner ${w} · Alias __________________</h2><p>${w==='A'?'30 settlers each use 3 L of water per day. Each water module supplies 30 L/day.':'28 settlers each use 0.8 kg of oxygen per day. Each oxygen module supplies 8 kg/day.'}</p><p>Daily demand: __________________</p><p>Ten-day demand: __________________</p><p>Demand ÷ module capacity: __________________</p><p>Minimum whole modules: __________________</p><p>Why is this count enough? __________________________________</p><p>________________________________________________________</p></section>`).join('')}${credit()}</section>`;}
function printView(title,html){printHTML=html;$('#print-root').innerHTML=html;show(title,`<div class="actions no-print">${btn('Print / Save PDF','print','','primary')}${btn('Close preview','close')}</div><div class="report-preview">${html}</div>`);}
const glossary={habitat:'A living space. Here each provides eight places and 24 m² of floor area.',stock:'An amount held at a particular time, such as liters in a tank.',rate:'An amount per unit time, such as liters per day.',reserve:'What remains after needs or limits are accounted for.',demand:'The amount needed.',production:'The amount supplied by a module over time.',surplus:'Production above demand.',deficit:'Demand above production.',capacity:'The maximum usable amount, output or occupancy.',model:'A simplified representation. Its conclusions depend on its assumptions.'};
async function action(name,el){message='';switch(name){
case 'new':save();clearTimeout(saveTimer);session=C.newSession();errors=[];close();save();render();break;
case 'save':save();break;case 'next':next();break;case 'back':session.currentStage=Math.max(1,session.currentStage-1);errors=[];save();render();break;
case 'check':checkGroup(el.dataset.group);break;case 'plot':render();break;
case 'finish':errors=C.check(session,'C10');const out=C.outcome(session);if(out.missing.length)errors.push({message:'Finish or recheck '+out.missing.join(', ')+'.'});if(!errors.length){session.completedAt=C.now();message='Mission saved. Individual paper work and explanations keep their teacher-review status.';}save();summaryErrors();break;
case 'revise':session.currentStage=3;errors=[];render();break;
case 'help':{const g=el.dataset.group,parts=C.help[g],d=el.dataset.key?C.definitions(session)[el.dataset.key]:null;session.support.push({group:g,at:C.now()});schedule();show(d?.label||parts[0],`<p>${esc(parts[1])}</p><h3>Unit and format</h3><p>${d?.unit?esc(d.unit)+'. ':''}${d?.kind==='expression'?'An equivalent linear expression in t.':d?.kind==='number'?'Enter an exact value or equivalent fraction.':'Use the labeled choices or a brief explanation.'}</p><h3>What to do</h3><p>${esc(parts[2])}</p><h3>Example — different values</h3><p>${esc(parts[3])}</p>`);break;}
case 'glossary':show('Mission glossary',Object.entries(glossary).map(([k,v])=>`<h3>${esc(k)}</h3><p>${esc(v)}</p>`).join(''));break;
case 'close':close();break;case 'export':exportProgress();break;case 'sessions':sessions();break;
case 'resume':clearTimeout(saveTimer);session=store.read(el.dataset.id);errors=[];close();saveStatus='Restored saved mission';render();break;
case 'duplicate':save();session=C.duplicate(store.read(el.dataset.id));save();close();render();break;
case 'delete':confirmDeletion([el.dataset.id]);break;case 'clearAll':save();confirmDeletion(store.ids());break;case 'clearMemory':confirmDeletion([],true);break;
case 'confirmDelete':clearTimeout(saveTimer);store.remove(deleteIds);if(session&&deleteIds.includes(session.sessionId))session=null;deleteIds=[];saveStatus='Selected work deleted';render();sessions();break;
case 'confirmMemory':clearTimeout(saveTimer);session=null;close();saveStatus='In-memory work cleared';render();break;
case 'backup':backup();break;case 'import':importFile();break;case 'importCopies':importCopies();break;
case 'conflictReload':clearTimeout(saveTimer);session=store.read(session.sessionId);close();render();break;case 'conflictCopy':session=C.duplicate(session);close();save();render();break;
case 'teacher':teacher();break;case 'teacherPrint':printView('Teacher answer reference',teacherReference());break;case 'report':printView('Mission report',studentReport());break;
case 'patch':if(!session)throw Error('Start a mission first.');printView('Mission patch',`<section class="paper"><h1>Red Horizon</h1>${A.patch(esc(session.teamAlias),session.cfg,C.outcome(session).title)}<p>${esc(C.outcome(session).title)}</p>${credit(session)}</section>`);break;
case 'slips':printView('Individual transfer slips',slips());break;case 'print':$('#print-root').innerHTML=printHTML;window.print();break;
case 'diagnostics':show('Built-in diagnostics',`<ul>${C.diagnostics().map(d=>`<li>${d.passed?'Passed':'Failed'} · ${esc(d.name)}</li>`).join('')}</ul><p>These checks cover reference arithmetic only; physical devices, printing and school-network access need separate observation.</p>`);break;
case 'review':C.review(session,$('#review-key').value,$('#reviewer').value,$('#review-note').value,$('#review-status').value);save();teacher();break;
case 'oral':{const key=$('#review-key').value;if(C.definitions(session)[key].kind!=='text')throw Error('Choose a prose field for an oral response.');C.setRaw(session,key,'Oral response: '+$('#review-note').value);C.check(session,C.definitions(session)[key].g);C.review(session,key,$('#reviewer').value,$('#review-note').value,$('#review-status').value);save();teacher();break;}
case 'bypass':C.bypass(session,$('#bypass-group').value,$('#reviewer').value,$('#review-note').value);save();teacher();render();break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();Promise.resolve(action(el.dataset.action,el)).catch(err=>show('Action not completed',`<p>${esc(err.message)}</p><p>Keep this page open and export current work if needed.</p>`));return;}const nav=e.target.closest('[data-stage]');if(nav&&session&&!nav.disabled){session.currentStage=Number(nav.dataset.stage);errors=[];save();render();window.scrollTo(0,0);}});
document.addEventListener('input',e=>{const el=e.target;if(!session)return;try{if(el.dataset.field!==undefined){C.setRaw(session,el.dataset.field,el.value);const old=el.closest('.field')?.querySelector('.feedback');if(old){old.textContent='Edited · check again';old.className='feedback bad';}schedule();}else if(el.dataset.meta){session[el.dataset.meta]=el.type==='checkbox'?el.checked:el.value;schedule();}}catch(err){message=err.message;}});
document.addEventListener('change',e=>{const el=e.target;if(!session)return;try{if(el.dataset.config){C.setConfig(session,el.dataset.config,el.value);message='Plan changed. Earlier responses are retained; affected work needs rechecking.';errors=[];save();render();}else if(el.hasAttribute('data-resource')){session.resource=el.value;session.completedAt=null;save();render();}else if(el.tagName==='SELECT'&&el.dataset.field){C.setRaw(session,el.dataset.field,el.value);schedule();render();}}catch(err){show('Check this choice',`<p>${esc(err.message)}</p>`);}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});$('#dialog').addEventListener('cancel',e=>{e.preventDefault();close();});
window.addEventListener('storage',e=>{if(session&&e.key===C.PREFIX+'session:'+session.sessionId){clearTimeout(saveTimer);if(e.newValue===null){const old=session;session=null;message='This mission was deleted in another tab. Current unsaved work is available as an export below.';render();show('Mission removed in another tab',`<p>The deleted saved record will not be recreated automatically.</p><div class="actions">${btn('Export this tab’s work','exportDeleted')}</div>`);const b=$('[data-action="exportDeleted"]');b.addEventListener('click',()=>download(old,'MarsColony_unsaved_'+old.sessionId+'.json'));}else{const newer=store.read(session.sessionId);if(newer?.localRevision>session.localRevision)conflict();}}});
window.addEventListener('beforeunload',()=>{if(session)save();});render();
})();
</script></body></html>
