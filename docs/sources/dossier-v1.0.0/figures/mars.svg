<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="415" viewBox="0 0 1200 415"><title>mars</title><rect x="0" y="0" width="1200" height="415" rx="12" fill="#F2F6F8" stroke="none" stroke-width="1"/><text x="28" y="36" font-family="Lato,Arial,sans-serif" font-size="21" fill="#A35037" font-weight="700" text-anchor="start">MARS COLONY / STOCKS ARE NOT RATES</text><text x="28" y="77" font-family="Lato,Arial,sans-serif" font-size="24" fill="#142D43" font-weight="700" text-anchor="start">24 colonists · 10 Earth days · authored classroom model</text><rect x="30" y="109" width="255" height="139" rx="8" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="48" y="140" font-family="Lato,Arial,sans-serif" font-size="17" fill="#A35037" font-weight="700" text-anchor="start">WATER</text><text x="48" y="184" font-family="Lato,Arial,sans-serif" font-size="18" fill="#142D43" font-weight="700" text-anchor="start">90 L/day produced</text><text x="48" y="218" font-family="Lato,Arial,sans-serif" font-size="17" fill="#536779" font-weight="400" text-anchor="start">72 L/day used</text><rect x="325" y="109" width="255" height="139" rx="8" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="343" y="140" font-family="Lato,Arial,sans-serif" font-size="17" fill="#A35037" font-weight="700" text-anchor="start">OXYGEN</text><text x="343" y="184" font-family="Lato,Arial,sans-serif" font-size="18" fill="#142D43" font-weight="700" text-anchor="start">24 kg/day produced</text><text x="343" y="218" font-family="Lato,Arial,sans-serif" font-size="17" fill="#536779" font-weight="400" text-anchor="start">19.2 kg/day used</text><rect x="620" y="109" width="255" height="139" rx="8" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="638" y="140" font-family="Lato,Arial,sans-serif" font-size="17" fill="#A35037" font-weight="700" text-anchor="start">FOOD</text><text x="638" y="184" font-family="Lato,Arial,sans-serif" font-size="18" fill="#142D43" font-weight="700" text-anchor="start">172.8 k