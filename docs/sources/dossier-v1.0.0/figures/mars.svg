="Lato,Arial,sans-serif" font-size="22" fill="#142D43" font-weight="700" text-anchor="middle">18 kWh</text><text x="1050" y="348" font-family="Lato,Arial,sans-serif" font-size="16" fill="#536779" font-weight="400" text-anchor="middle">after day 6</text><text x="31" y="391" font-family="Lato,Arial,sans-serif" font-size="19" fill="#536779" font-weight="400" text-anchor="start">Battery reserve falls by 6 kWh on each storm day. Daily energy demand and stored energy remain separate.</text></svg>