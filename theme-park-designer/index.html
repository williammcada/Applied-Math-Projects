function landscapeTools(){return `<section class="panel"><div class="panel-head"><div><p class="kicker">Land tools</p><h2>Connect. Plant. Leave room.</h2></div>${btn('?','help','data-group="C06" aria-label="Help: land tools"','help')}</div><div class="land-tools">${btn('Path cells','layer','data-layer="paths"',landLayer==='paths'?'active':'')}${btn('Green cells','layer','data-layer="green"',landLayer==='green'?'active':'')}${btn(erase?'Erase mode ✓':'Erase mode','erase','',''+(erase?'active':''))}${btn('Undo edit','undo')}</div><p class="muted">Tap a cell, drag a straight stroke, or fill a rectangle below. Use an erase action before changing a cell from path to green. Main paths are reserved and cannot be erased.</p><div class="placement"><div><label for="land-x">Left x (m)</label><input id="land-x" type="number" step="2" value="0"></div><div><label for="land-y">Bottom y (m)</label><input id="land-y" type="number" step="2" value="0"></div><div><label for="land-w">Width (m)</label><input id="land-w" type="number" step="2" min="2" value="2"></div><div><label for="land-h">Height (m)</label><input id="land-h" type="number" step="2" min="2" value="2"></div></div><div class="actions" style="margin-top:15px">${btn(erase?'Erase rectangle':'Fill rectangle','paintRect','','primary')}${btn('Designate expansion rectangle','expansion')}${btn('Remove expansion designation','removeExpansion')}</div><p class="muted" style="font-size:.8rem;margin-top:12px">Expansion uses the same rectangle controls. It must be unoccupied to qualify. It costs nothing and remains part of undeveloped land.</p></section>`}

let o=C.outcome(s),cp=o.chosen?.plan||p;return `<div class="inspector-result">${A.inspector(o.code)}<div><p class="kicker">${esc(s.parkName||'Your park')} · Your plan’s next chapter</p><h2>${o.title}</h2><p>${o.complete?`The selected plan uses ${o.greenArea} m² of green space and leaves ${fmt(o.balance)} cr in the budget.`:'Finish the independent transfer and any remaining checks to complete the report.'}</p></div></div>${A.map(cp,{decorative:true})}${o.complete?`<section class="panel">${o.findings.length?o.findings.map(x=>`<p>${esc(x.text)}</p>`).join(''):`<p>${o.distinction?`Your park opens with ${o.greenPercent.num()}% green space and a ${o.expansionArea} m² expansion zone.`:'The park meets the opening criteria. To earn distinction, retain at least 4,500 cr and designate one clear expansion rectangle of at least 100 m².'}</p>`}<p class="muted">Corrected work and help remain visible. Design success is separate from independent mastery. Reflection status: ${s.reviews.some(x=>x.kind==='reflection'&&x.fp===C.fp(s,'reason')&&x.response===s.raw.reason)?'Teacher reviewed':'Submitted — teacher review pending'}.</p></section>`:''}<div class="actions" style="margin:20px 0">${btn('Student report','report','','primary')}${btn('Scale map','mapPrint')}${btn('Brochure / inspection','brochure')}${btn('Transfer slips','slips')}</div>${['A','B'].map(w=>transfer(w)).join('')}<div class="actions">${btn('Finish and review outcome','finish','','green')}</div>`}
function transfer(w){let digital=s.transferMode[w]==='digital',done=C.groupOK(s,'C09'+w),other=C.groupOK(s,'C09'+(w==='A'?'B':'A'));let inner=`<p><strong>${esc(w==='A'?s.partnerA:s.partnerB)}</strong>: your pavilion is ${w==='A'?'12 m × 8 m':'16 m × 6 m'}. Use 1 cm:4 m and a 2,400 m² site. Work independently from your partner.</p><label for="transfer-mode-${w}">Response mode</label><select id="transfer-mode-${w}" data-transfer="${w}"><option value="digital" ${digital?'selected':''}>Digital response</option><option value="paper" ${s.transferMode[w]==='paper'?'selected':''}>Paper — teacher records evidence</option><option value="oral" ${s.transferMode[w]==='oral'?'selected':''}>Oral — teacher records evidence</option></select>`;if(!digital)return `<section class="panel"><h2>Independent transfer · ${w}</h2>${inner}<p>${done?'Teacher submission recorded.':'Awaiting teacher entry/review. Printing alone does not complete the task.'}</p></section>`;if(done&&!other)return `<section class="panel"><h2>Independent transfer · ${w}</h2>${inner}<div class="notice">Response recorded. Values remain covered until both students submit.</div></section>`;return group('C09'+w,inner)}
function render(focus=false){if(!s){$('#app').innerHTML=home();return}let n=s.currentStage;$('#app').innerHTML=top()+`<div class="workspace"><aside class="sidebar"><p class="side-label">Your design journey</p><nav class="steps" aria-label="Project stages">${C.stages.map((t,i)=>btn(`<span class="step-num">${String(i+1).padStart(2,'0')}</span>${t}`,'stage',`data-stage="${i+1}" ${i+1===n?'aria-current="step"':''}`,i+1===n?'active':'')).join('')}</nav><div class="side-card"><strong>${esc(s.parkName||'A park in progress')}</strong>${esc(s.teamAlias)}<br>Planner: ${esc(s.planner==='A'?s.partnerA:s.partnerB)}<br>${btn('Swap roles','swap','','small')}<br><br>${btn('Glossary','glossary','','small')}${btn('Calculator','calculator','','small')}</div><p class="credit">A William McAda Product<br>Content / schema 1.0.0</p></aside><main class="main" id="main"><div class="main-inner"><div class="stage-head"><div><p class="eyebrow">ParkWorks / ${String(n).padStart(2,'0')} of 08</p><h1 tabindex="-1" id="stage-title">${C.stages[n-1]}</h1></div><span class="pill">${n<=2?'Lesson 1 · Survey':n<=4?'Lesson 2 · Design':n<=6?'Lesson 3 · Allocate':'Lesson 4 · Inspect'}</span></div><p class="stage-desc">${['Every park starts with a possibility. Read the offer and meet your design brief.','Before you build, learn how this piece of land fits on a page.','Every attraction needs room. Calculate what it uses—and what it reserves.','Give every facility a place. Keep the geometry honest as your park takes shape.','A park needs routes, breathing space, and room for its next big idea.','Put a price on your decisions. Check the plan against the construction budget.','Good designers revise. Compare two plans and make a case for the stronger one.','Your design has a story to tell. Show what works, what changed, and what comes next.'][n-1]}</p>${conflict?`<div class="errors">A newer revision was saved in another tab.<div class="actions">${btn('Reload newer work','conflictReload')}${btn('Save my work as a copy','conflictCopy')}</div></div>`:''}${message?`<div class="message" role="status">${esc(message)}</div>`:''}${errors.length?`<div class="errors" id="errors" tabindex="-1" role="alert"><strong>Check these before continuing</strong><ul>${errors.map(e=>`<li>${btn(esc(e.message),'focus',`data-key="${esc(e.key)}"`)}</li>`).join('')}</ul></div>`:''}${stageContent()}<div class="stage-footer">${btn('← Back','back',n===1?'disabled':'')}${n<8?btn('Check & continue →','next','','primary'):btn('Return to inspection','stage','data-stage="7"')}</div><p class="credit">William McAda · A WILLIAM MCADA PRODUCT · Theme Park Designer v${C.VERSION}</p></div></main></div>`;if(focus){(errors.length?$('#errors'):$('#stage-title'))?.focus();$('#main')?.scrollIntoView({block:'start'})}}

else {const shown=(key,unit='')=>C.state(s,key,p)==='checked'?esc(p.raw[key])+' '+unit:'Not yet checked';page('Design report',`<h2>${o.title}</h2><p>${o.complete?'Current required evidence is recorded.':'DRAFT: required evidence is missing, stale, or awaiting review.'} Student corrections and assistance are listed separately.</p>${planMap(p)}${coordTable(p)}`);page('Land and construction ledger',table(['Allocation','Area'],[['Facilities',shown('facArea','m²')],['Paths',shown('pathArea','m²')],['Green',shown('greenArea','m²')],['Undeveloped',shown('unused','m²')],['Expansion (within undeveloped)',p.expansion?shown('expArea','m²'):'Not designated']])+table(['Cost','Credits'],[['Facilities',shown('facilityCost')],['Paths',shown('pathCost')],['Landscape',shown('greenCost')],['Full boundary including gate',shown('boundaryCost')],['Total',shown('total')],['Budget balance',shown('balance')]])+`<p>${C.planOK(s,p)?g.findings.map(x=>esc(x.text)).join('<br>')||'All critical criteria met.':'Complete the current calculations before the full numerical inspection.'}</p><p>${g.errors.map(x=>esc(x.text)).join('<br>')}</p>`);page('Our revision',`<h2>Plan A</h2>${C.snapshot(s,s.aId)?A.map(C.snapshot(s,s.aId).plan):'<p>Not yet saved.</p>'}<h2>Plan B</h2>${C.snapshot(s,s.bId)?A.map(C.snapshot(s,s.bId).plan):'<p>Not yet saved.</p>'}<p>Recommended: ${esc(s.raw.chosen||'Pending')}. Compared ${esc(s.raw.metric||'—')}: ${esc(s.raw.valueA||'—')} → ${esc(s.raw.valueB||'—')}; change ${esc(s.raw.delta||'—')}.</p>`);page('Design reasoning and individual evidence',`<p>${esc(s.raw.reason||'Reflection not submitted.')}</p><p>Reflection: ${s.reviews.some(r=>r.kind==='reflection'&&r.fp===C.fp(s,'reason')&&r.response===s.raw.reason)?'Teacher reviewed':'Submitted / pending teacher review'}.</p>${table(['Learner','Response','Status'],['A','B'].map(w=>[esc(w==='A'?s.partnerA:s.partnerB),s.transferMode[w],C.groupOK(s,'C09'+w)?'Recorded':'Pending']))}<p>Planner/Checker swaps: ${s.lessonSwaps.length}. Pair h function preview(kind){printHTML=report(kind);$('#print-root').innerHTML=printHTML;dialog(kind==='teacher'?'Teacher reference':kind==='map'?'Scale map':'Print preview',`<p>Choose A4 or Letter. For a measured scale plan, print at 100% and check the 5 cm calibration line.</p>${btn('Print / Save PDF','print','','primary')}<div class="print-preview" style="margin-top:20px">${printHTML.replace(/(mapGrid|greenHatch|expandHatch)-m(\d+)/g,'$1-preview-m$2')}</div>`)}

document.addEventListener('input',e=>{let el=e.target;if(!s)return;if(el.dataset.field){let d=C.defs(s)[el.dataset.field],t=d.global?s:s.plan;t.raw[d.key]=el.value;s.completedAt=null;save()}if(el.dataset.meta){s[el.dataset.meta]=el.type==='checkbox'?el.checked:el.value;save()}});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='place-rotation')rotation=Number(el.value);if(el.dataset.transfer){s.transferMode[el.dataset.transfer]=el.value;save();render()}if(['metric','chosen'].includes(el.dataset.field)){save();render()}if(el.id==='calc-enabled'||el.id==='transfer-calc')return});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let act=b.dataset.action;try{

if(act==='saveSettings'){s.calculator=$('#calc-enabled').checked;s.transferCalculator=$('#transfer-calc').checked;save();close();render();return}if(act==='reviewReflection'){let note=$('#teacher-note').value.trim();if(!note)throw Error('Record a short review note.');s.reviews.push({kind:'reflection',note,at:C.now(),fp:C.fp(s,'reason'),response:s.raw.reason||''});save();close();render();return}if(act==='reviewPaper'){let note=$('#teacher-note').value.trim(),w=b.dataset.who;if(!note)throw Error('Record what was reviewed.');if(s.transferMode[w]==='digital')throw Error('Select paper or oral mode in the student transfer panel first.');s.transferPaper[w]={note,at:C.now(),kind:'Transfer '+w};save();close();render();return}if(act==='bypass'){C.bypass(s,$('#bypass-group').value,$('#teacher-note').value);save();close();message='Teacher bypass recorded. Final status will be provisional.';render();return}
if(act==='help'){let gr=b.dataset.group,t=gr==='C08'||gr.startsWith('C09')?s:s.plan;if(t.support.length>=C.MAX_HISTORY)throw Error('Support history full. Export before starting fresh.');t.support.push({group:gr,kind:'help',at:C.now()});save();let h=C.help[gr];dialog('Help: '+h[0],['Meaning and format','Method','Different-number example'].map((t,i)=>`<h3>${t}</h3><p>${h[i+1]}</p>`).join(''));return}

if(act==='calculator'){if(!s.calculator||(s.currentStage===8&&!s.transferCalculator))throw Error('The in-app calculator is off for this task. Ask the teacher if support is needed.');(s.currentStage===8?s:s.plan).support.push({kind:'calculator',at:C.now(),stage:s.currentStage});save();dialog('Calculator',`<p>Use arithmetic support after choosing the correct quantities and formula.</p><div class="placement"><div><label for="calc-a">First number</label><input id="calc-a"></div><div><label for="calc-op">Operation</label><select id="calc-op"><option value="add">+</option><option value="sub">−</option><option value="mul">×</option><option value="div">÷</option></select></div><div><label for="calc-b">Second number</label><input id="calc-b"></div>${btn('Calculate','calculate')}</div><p id="calc-result" role="status"></p>`);return}if(act==='calculate'){let a=C.numeric($('#calc-a').value),v=C.numeric($('#calc-b').value),r=a[$('#calc-op').value](v);$('#calc-result').textContent='Result: '+r.str()+(r.d!==1n?' ≈ '+r.num():'');return}
if(act==='focus'){let el=$('#f-'+b.dataset.key)||$('#'+b.dataset.key)||$('#group-C05');el?.focus();el?.scrollIntoView({block:'center'});return}if(act==='stage'){let n=Number(b.dataset.stage);if(n>s.maxStage){message='Complete the preceding stage before opening '+C.stages[n-1]+'.';render();return}s.currentStage=n;errors=[];message='';save();render(true);return}if(act==='next'){next();return}if(act==='back'){s.currentStage=Math.max(1,s.currentStage-1);errors=[];message='';save();render(true);return}if(act==='check'){errors=C.check(s,b.dataset.group);save();message=errors.length?'':'Checkpoint checked. Corrected work and support are retained.';render(true);return}if(act==='swap'){s.planner=s.planner==='A'?'B':'A';s.lessonSwaps.push({stage:s.currentStage,manual:true,at:C.now()});save();render();return}
if(act==='selectFacility'){selected=b.dataset.id;rotation=s.plan.facilities[selected]?.rotation||0;render();return}if(act==='place'){let old=C.place(s.plan,selected,Number($('#place-x').value),Number($('#place-y').value),Number($('#place-rotation').value));recordEdit(old);return}if(act==='rotationPreview'){s.plan.rotationSeen=true;save();dialog('Rotate a coaster',`<p>The unrotated coaster is 20 m wide and 12 m high. Turning it 90° swaps the dimensions to 12 m wide and 20 m high. Calculate both areas in your checkpoint.</p><svg viewBox="0 0 460 210" role="img" aria-label="A 20 by 12 rectangle rotates to a 12 by 20 rectangle"><rect x="15" y="50" width="180" height="108" fill="#f2c198" stroke="#293450"/><rect x="300" y="10" width="108" height="180" fill="#f2c198" stroke="#293450"/><text x="240" y="105" text-anchor="middle" font-size="25">↻</text><text x="105" y="180" text-anchor="middle">20 × 12 m</text><text x="354" y="207" text-anchor="middle">12 × 20 m</text></svg>`);return}if(act==='toggleMap'){decorative=!decorative;render();return}if(act==='undo'){if(!undoStack.length)throw Error('No geometry edit to undo.');let previous=undoStack.pop();previous.history=s.plan.history;previous.support=s.plan.support;s.plan=previous;s.completedAt=null;save();message='Last geometry edit undone. Attempt history is retained.';render();return}
if(act==='buildPaths'){let old=C.clone(s.plan);s.plan.mainDrawn=true;s.plan.revision++;recordEdit(old);return}if(act==='layer'){landLayer=b.dataset.layer;render();return}if(act==='erase'){erase=!erase;render();return}if(act==='paintRect'){let r=['x','y','w','h'].map(k=>Number($('#land-'+k).value)),old=C.paint(s.plan,landLayer,C.rectCells(r),erase);recordEdit(old);return}if(act==='expansion'){let r=['x','y','w','h'].map(k=>Number($('#land-'+k).value)),old=C.setExpansion(s.plan,r);recordEdit(old);return}if(act==='removeExpansion'){recordEdit(C.setExpansion(s.plan,null));return}if(act==='inspect'){dialog('Inspect this working plan',inspect(C.geometry(s.plan)));return}
if(act==='snapshot'){C.saveSnapshot(s,b.dataset.label);save();message='Inspected Plan '+b.dataset.label+' saved. It will not change when you edit the working design.';errors=[];render();return}if(act==='revise'){s.currentStage=4;errors=[];message='Revise the working design, recheck affected fields, then save it as Plan B.';save();render(true);return}if(act==='loadSnapshot'){let x=C.snapshot(s,b.dataset.id);if(!x)throw Error('That snapshot was deleted.');s.plan=C.clone(x.plan);s.plan.revision++;s.currentStage=4;s.completedAt=null;undoStack=[];save();message='A copy is now your working design. The saved snapshot is unchanged.';render(true);return}
if(act==='finish'){errors=[];for(let gr of ['C08','C09A','C09B'])if(!C.groupOK(s,gr))errors.push(...C.check(s,gr));let o=C.outcome(s);if(o.complete)s.completedAt=C.now();message=o.title;save();render(true);return}if(act==='conflictReload'){s=db.read(s.sessionId);conflict=false;message='Loaded the newer revision.';render(true);return}if(act==='conflictCopy'){s=C.duplicate(s);conflict=false;save();message='Saved current edits as a new session.';render(true);return}
}catch(err){let el=$('#dialog-error');if(el)el.textContent=err.message;else{message=err.message;render()}}});
$('#file-import').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('Progress files must be no larger than 5 MiB.');imported=C.decode(await f.text());dialog('Review import',`<p>${imported.length} Theme Park session(s) validated. Import creates new identities and keeps existing sessions.</p>${imported.map(x=>`<p>${esc(x.teamAlias)} · ${esc(x.parkName)} · stage ${x.currentStage}</p>`).join('')}<div class="actions">${btn('Cancel','close')}${btn('Import as new copies','importCommit','','primary')}</div>`)}catch(err){dialog('Import could not continue',`<p>${esc(err.message)}</p><p>Current work was not changed.</p>`)}e.target.value=''});
function mapPoint(e){let svg=e.target.closest('svg[data-map]');if(!svg)return null;let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let v=pt.matrixTransform(svg.getScreenCTM().inverse());if(v.x<0||v.x>60||v.y<0||v.y>40)return null;return {x:Math.round(v.x/2)*2,y:Math.round((40-v.y)/2)*2,cell:Math.min(19,Math.floor((40-v.y)/2))*30+Math.min(29,Math.floor(v.x/2))}}
function applyMap(a,b=a){try{if(s.currentStage===4){recordEdit(C.place(s.plan,selected,a.x,a.y,rotation))}else if(s.currentStage===5){let [ax,ay]=C.xy(a.cell),[bx,by]=C.xy(b.cell),r=[Math.min(ax,bx),Math.min(ay,by),Math.abs(ax-bx)+2,Math.abs(ay-by)+2];recordEdit(C.paint(s.plan,landLayer,C.rectCells(r),erase))}}catch(err){message=err.message;render()}}
document.addEventListener('pointerdown',e=>{if(e.target.matches('.map-hit'))dragStart=mapPoint(e)});document.addEventListener('pointerup',e=>{if(dragStart){let end=mapPoint(e);if(end)applyMap(dragStart,end);dragStart=null}});document.addEventListener('dragstart',e=>{let f=e.target.closest('[data-facility],[data-action="selectFacility"]');if(f){selected=f.dataset.id||f.dataset.facility;e.dataTransfer.setData('text/plain',selected)}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-map]'))e.preventDefault()});document.addEventListener('drop',e=>{if(e.target.closest('[data-map]')){e.preventDefault();let p=mapPoint(e);if(p)applyMap(p)}});
